<script>
/* TallyOne 2.20 — 로그아웃 인사 화면에서 이 쇼를 자동으로 시작시킨다.
   ?auto=1 로 열렸을 때만 동작한다(단독으로 열면 종전대로 재생 버튼을 누른다).
   ⚠ 소리는 «사람이 눌러야» 브라우저가 허용한다. 로그아웃 자체가 누른 동작이라
     같은 출처 iframe 이면 대개 이어지지만, 막히면 **그림만 조용히 돈다** — 실패해도 화면은 산다.
   ⚠ 버튼을 글자로 찾는다(번들이 minify 되어 클래스명을 믿을 수 없다). 6초 안에 못 찾으면 포기한다. */
(function () {
  if (!/[?&]auto=1/.test(location.search)) return;
  var n = 0;
  var t = setInterval(function () {
    if (++n > 40) { clearInterval(t); return; }
    var bs = document.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) {
      var x = bs[i].textContent || '';
      if (/재생|▶|시작/.test(x)) { try { bs[i].click(); } catch (e) {} clearInterval(t); return; }
    }
  }, 150);
})();
</script>
