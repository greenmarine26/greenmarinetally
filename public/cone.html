<body>
<header>
  <h1>콘 계산기 <span class="badge">평택항 · 무료배포</span></h1>
  <div class="sub">양하·선적 플랜으로 고정장치 콘 자동 계산</div>
</header>
<div class="wrap" id="app"></div>
<div class="footer-note">
  무료 배포 · 오프라인 작동 · 비용 없음<br>
  자동 인식 후 반드시 확인하세요. 콘 작업은 정확도가 생명입니다.
</div>
<script>
// ============ 콘 계산 엔진 (검증됨) ============
const ROWS=['10','08','06','04','02','01','03','05','07','09'];

function calcCones(deck, hold, shipType){
  const hold40 = shipType==='container' ? 0 : 4;
  let dk=0, el=0, hd=0;
  const occ=(g,t,r)=> g[t] && g[t][r] && g[t][r]!=='.';
  function area(g,isDeck){
    const tiers=Object.keys(g).map(Number).sort((a,b)=>a-b);
    if(!tiers.length) return;
    const low=tiers[0];
    for(const t of tiers){
      if(t===low) continue;
      for(const r in g[t]){
        const sz=g[t][r];
        if(sz!=='O40'&&sz!=='O20') continue;
        if(!occ(g,t-2,r)) continue;
        if(isDeck){ if(sz==='O40') dk+=4; else {dk+=2; el+=2;} }
        else { if(sz==='O40') hd+=hold40; else hd+=1; }
      }
    }
  }
  area(deck,true); area(hold,false);
  return {deck:dk, ele:el, hold:hd};
}

// 베이 합본: 7-8-9 => key 8. label "BAY (08) 09" or "BAY 07"
function bayGroupKey(label){
  const nums=(label.match(/\d+/g)||[]).map(Number);
  if(!nums.length) return label;
  // 짝수가 있으면 짝수, 없으면 홀수를 짝수로 내림(7->? ) : 7,8,9 묶음의 대표 = 가운데 짝수
  const even=nums.find(n=>n%2===0);
  if(even!==undefined) return even;
  // 홀수만(예: BAY 07) => 짝꿍 짝수 = 홀수-1 or +1? 표기상 07은 (08)09와 한묶음 → 8
  const odd=nums[0];
  return odd+1; // 07->8, 23->24
}

// 배분: 데크콘÷4, 코끼리콘÷2, 홀드콘 트윈합본×2
function distribute(cones){
  return {
    deckPer: Math.round(cones.deck/4),
    elePer: Math.round(cones.ele/2),
    holdTotal: cones.hold*2
  };
}
// ============ EDI(BAPLIE) 파서 — 앱 통합용 ============
function isEDI(text){
  return /UNB\+|LOC\+147\+/.test(text) && /EQD\+/.test(text);
}

function parseEDI(text){
  // 평택 기준: 선적=POL KRPTK, 양하=POD KRPTK. 둘 다 시도해 더 많은 쪽 채택.
  const segs=text.split("LOC+147+");
  const rowsAll=[];
  for(let i=1;i<segs.length;i++){
    const s=segs[i];
    const pm=s.match(/^(\d{7})/);
    if(!pm) continue;
    const pos=pm[1];
    const bay=pos.slice(0,3), row=pos.slice(3,5), tier=parseInt(pos.slice(5,7));
    // ISO: EQD+CN 세그먼트(종결자 ')를 정확히 잘라 + 분리 → parts[3]의 : 앞부분.
    //   (이전 결함: /EQD\+CN\+\S+\+(\w{4})/ 의 \S+ 가 탐욕적으로 다음 + 까지 삼켜
    //    11자리 컨번호 뒤 ISO 4자리를 못 잡고 20ft(2xxx)를 40ft로 오판)
    let iso='';
    const eqd=s.match(/EQD\+CN\+[^']*/);
    if(eqd){
      const parts=eqd[0].split('+');           // ['EQD','CN',컨번호,'45G1:102:5',...]
      iso=((parts[3]||'').split(':')[0]||'').toUpperCase();
    }
    const size=(iso&&iso[0]==='2')?'20':'40';
    // POL/POD: 코드만(영숫자) — 뒤 : 콜론 한정자 제외
    const polm=s.match(/LOC\+9\+([A-Za-z0-9]+)/), podm=s.match(/LOC\+11\+([A-Za-z0-9]+)/);
    rowsAll.push({bay,row,tier,size,pol:polm?polm[1]:null,pod:podm?podm[1]:null});
  }
  // 제목/POL·POD로 선적/양하 판별
  const up=text.toUpperCase();
  let kind=null, rows;
  const polPtk=rowsAll.filter(r=>r.pol==='KRPTK');
  const podPtk=rowsAll.filter(r=>r.pod==='KRPTK');
  if(up.includes('LOAD')||polPtk.length>podPtk.length){ kind='stow'; rows=polPtk.length?polPtk:rowsAll; }
  else { kind='disch'; rows=podPtk.length?podPtk:rowsAll; }
  // 선박명: TDT 세그먼트 끝(11: 다음 토큰). 종결자 ' 또는 줄바꿈까지.
  let vessel='';
  const tdt=text.match(/TDT\+[\s\S]*?(?=['~\n\r]|$)/);
  if(tdt){
    const parts=tdt[0].split(':');
    const last=(parts[parts.length-1]||'').trim();
    // 선박명은 영문자 포함 + 길이>=3. 숫자만(예:"20")이면 무시
    if(/[A-Za-z]/.test(last) && last.length>=3) vessel=last;
  }
  return {rows, kind, isEDI:true, vessel};
}

// ============ ASC 파서 (검수앱 parseAscFile 위치 추출분) ============
// 검수앱은 ASC도 EDI와 같은 raw/edi 경로에 보관한다. ASC도 EDI를 대체할 수 있게 처리.
// 판별: .asc 확장자 또는 첫 줄이 $604로 시작.
function isASC(text){
  if(!text) return false;
  const head=text.slice(0,200);
  return /^\$604/.test(head.trimStart()) || /\n\$604/.test(head);
}
// 검수앱 normalizeBay: 정수화 ("01"→"1"). 콘앱 EDI는 bay 3자리지만 ediToBayGroups가
// parseInt로 처리하므로 자리수 무관. ASC도 동일 형식 객체 반환.
function parseASC(text){
  const lines=text.split(/\r?\n/);
  const rowsAll=[];
  let vessel='';
  for(const ln of lines){
    if(ln.startsWith('$604')){
      const parts=ln.substring(4).split('/');
      if(parts.length>=3) vessel=(parts[1]||'').trim();
      break;
    }
  }
  for(const line of lines){
    if(line.length<50) continue;
    if(line.startsWith('$')) continue;
    if(line.trimStart().startsWith('***')) continue;
    const slot=line.substring(0,6).trim();
    if(!/^\d{6}$/.test(slot)) continue;
    const cn=line.substring(7,18).replace(/[\s\-]/g,'').toUpperCase();
    const hasCn=/^[A-Z]{4}\d{7}$/.test(cn);
    if(cn && !hasCn) continue;
    const bayN=parseInt(slot.substring(0,2),10);
    const bay=isNaN(bayN)?'':String(bayN);
    const row=slot.substring(2,4);
    const tier=parseInt(slot.substring(4,6),10);
    // BAY 00 메타 라인 차단 (cn 없고 bay='0')
    if(!cn && bay==='0') continue;
    // ISO/size: typeBlock(44~54)에서 앞 코드. 검수앱 규칙 간략 적용.
    const typeBlock=line.substring(44,54).trim();
    let size='40';
    // 20ft 판별: 코드에 '20' 또는 ISO 숫자형 앞자리 '2'
    const m1=typeBlock.match(/^([A-Z]{2})(\d{2})/);      // DC20, HC40, RF20 ...
    const m2=typeBlock.match(/^(\d{2})[A-Z]/);            // 22GP, 45GP ...
    if(m1){ size = m1[2]==='20' ? '20' : '40'; }
    else if(m2){ size = m2[1][0]==='2' ? '20' : '40'; }
    // POL/POD: 끝 10자(POL5+POD5) 우선
    const tail=line.replace(/\u0000/g,'').trim();
    let pol=null, pod=null;
    const pp=tail.match(/([A-Z]{5})([A-Z]{5})$/);
    if(pp){ pol=pp[1]; pod=pp[2]; }
    rowsAll.push({bay,row,tier,size,pol,pod});
  }
  const polPtk=rowsAll.filter(r=>r.pol==='KRPTK');
  const podPtk=rowsAll.filter(r=>r.pod==='KRPTK');
  let kind, rows;
  if(polPtk.length>podPtk.length){ kind='stow'; rows=polPtk.length?polPtk:rowsAll; }
  else { kind='disch'; rows=podPtk.length?podPtk:rowsAll; }
  return {rows, kind, isEDI:true, vessel};  // isEDI:true = 위치 rows 보유(다운스트림 동일 처리)
}

// EDI/ASC 자동 판별 통합 파서. raw 텍스트가 둘 중 무엇이든 위치 rows를 반환.
function parsePositions(text){
  if(isASC(text)) return parseASC(text);
  if(isEDI(text)) return parseEDI(text);
  return null;
}

// EDI rows → deck/hold tiers (콘엔진 입력). 베이그룹 합본은 결과 단계에서.
function ediToBayGroups(rows, shipType){
  const h40 = shipType==='container'?0:4;
  const filled=new Set(rows.map(r=>r.bay+'_'+r.row+'_'+r.tier));
  const groups={};
  for(const r of rows){
    const bay=parseInt(r.bay), tier=r.tier;
    const isDeck=tier>=80;
    if(!filled.has(r.bay+'_'+r.row+'_'+(tier-2))) continue; // 받침/최저단
    const gk = bay%2===0 ? bay : bay+1;
    if(!groups[gk]) groups[gk]={deck:0,ele:0,hold:0};
    if(isDeck){ if(r.size==='40') groups[gk].deck+=4; else {groups[gk].deck+=2; groups[gk].ele+=2;} }
    else { if(r.size==='40') groups[gk].hold+=h40; else groups[gk].hold+=1; }
  }
  return groups;
}

// ============ PDF/이미지 판독 ============
var PDF_OK=false;
try{
  if(typeof pdfjsLib!=='undefined'){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    PDF_OK=true;
  }
}catch(e){ PDF_OK=false; }

const state={ stow:null, disch:null, shipType:null, shipName:'', detected:false,
  voyages:null, voyageKey:null, loadingVoyages:false, voyErr:'' };

// ============ 검수앱 Firebase 연동 (읽기 전용, REST) ============
// 검수앱(Tallyman Master)이 voyages/{key}/{mode}/raw/edi 에 보관한 EDI 원문을 직접 읽어온다.
//   mode: discharge=양하, loading=선적
const FB_BASE='https://greenmarinetally-default-rtdb.asia-southeast1.firebasedatabase.app';

// 항차 목록 (raw EDI가 있는 항차만) 가져오기
async function fbFetchVoyages(){
  // 각 항차에 양하/선적 자료(raw EDI 또는 파싱된 ediContainers)가 있는지 판정.
  //   기존 항차는 raw가 없고 ediContainers만 있을 수 있음 → 둘 중 하나라도 있으면 포함(재업로드 불필요).
  const res=await fetch(`${FB_BASE}/voyages.json?shallow=false`);
  if(!res.ok) throw new Error('Firebase 응답 오류 ('+res.status+')');
  const all=await res.json();
  if(!all) return [];
  const out=[];
  const has=(sec)=>{
    if(!sec) return false;
    if(sec.raw && sec.raw.edi && sec.raw.edi.text) return true;
    if(sec.ediContainers && Object.keys(sec.ediContainers).length>0) return true;
    return false;
  };
  for(const key in all){
    const v=all[key]||{};
    const info=v.info||{};
    const hasD=has(v.discharge);
    const hasL=has(v.loading);
    if(!hasD&&!hasL) continue;
    out.push({
      key,
      vsl: info.vsl||key.split('_')[0]||'(선박명 미상)',
      imo: info.imo||'',
      voy: info.voy_l||info.voy_d||info.voy||'',
      voy_d: info.voy_d||'', voy_l: info.voy_l||'',
      hasD, hasL,
      createdAt: info.createdAt||0,
    });
  }
  out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); // 최신 항차 먼저
  return out;
}

// 항차 mode의 ediContainers(이미 파싱된 좌표)를 콘앱 rows 형식으로 가져오기.
//   검수앱이 저장한 그대로 → 재업로드 불필요, 검수앱과 동일 데이터. 없으면 null(→raw 폴백).
async function fbFetchEdiContainers(voyageKey, mode){
  const res=await fetch(`${FB_BASE}/voyages/${encodeURIComponent(voyageKey)}/${mode}/ediContainers.json`);
  if(!res.ok) return null;
  const obj=await res.json();
  if(!obj || typeof obj!=='object') return null;
  const rows=[];
  for(const k in obj){
    const c=obj[k]||{};
    if(c.bay==null || c.tier==null) continue;
    const iso=String(c.iso||'');
    const size = c.size ? String(c.size) : (iso && iso[0]==='2' ? '20' : '40');
    rows.push({
      bay:String(c.bay), row:String(c.row||'').padStart(2,'0'),
      tier:String(c.tier).padStart(2,'0'), size,
      pol:c.pol||null, pod:c.pod||null,
    });
  }
  return rows.length? rows : null;
}


// 특정 항차의 mode별 raw EDI 텍스트 가져오기
async function fbFetchRawEdi(voyageKey, mode){
  const res=await fetch(`${FB_BASE}/voyages/${encodeURIComponent(voyageKey)}/${mode}/raw/edi.json`);
  if(!res.ok) return null;
  const d=await res.json();

}

// 검수앱 베이사전(ship_bay_dict_v3) 캐시 — 검수앱이 매트릭스 빌더로 등록·동기화한 골격.
//   이게 있으면 검수앱과 동일한 카고플랜을 그릴 수 있다.
let _fbBayDict = null;
async function fbFetchBayDict(){

    if(!res.ok){ _fbBayDict={}; return _fbBayDict; }

  return _fbBayDict;

// 검수앱 fuzzyLookupAcrossDicts의 Firebase 매칭부 포팅 (code/imo/name/callsign).
//   콘앱은 임베드 사전(v2/v5) 없이 Firebase v3만 본다. 없으면 null(→좌표 역산 폴백).
function lookupBayDef(fbDict, imo, nameOrCode){
  if(!fbDict || Object.keys(fbDict).length===0) return null;
  const search = String(nameOrCode||'').toUpperCase().replace(/\s+/g,'');
  // 1) code 정확
  if(search && fbDict[search] && fbDict[search].bayDef) return fbDict[search];
  // 2) IMO
  if(imo){
    const e = Object.values(fbDict).find(e=>e && e.imo===imo && e.bayDef);
    if(e) return e;
  }
  // 3) name fuzzy (5글자 prefix)
  if(search && search.length>=4){
    const e = Object.values(fbDict).find(e=>{
      if(!e || !e.bayDef) return false;
      const en = String(e.name||'').toUpperCase().replace(/\s+/g,'');
      return en && (en.includes(search.slice(0,5)) || search.includes(en.slice(0,5)));
    });
    if(e) return e;
  }
  // 4) callsign
  if(search && search.length>=4){
    const e = Object.values(fbDict).find(e=>{
      if(!e || !e.bayDef) return false;
      const ec = String(e.callsign||'').toUpperCase();
      return ec && ec.length>=4 && (ec.startsWith(search) || search.startsWith(ec));
    });
    if(e) return e;
  }
  return null;
}

async function readPDF(file){
  if(!PDF_OK) throw new Error('PDF 기능을 쓰려면 인터넷 연결이 필요합니다. EDI나 사진을 사용하거나, 인터넷 연결 후 다시 열어주세요.');
  showLoading('PDF 여는 중...');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  showLoading('PDF 그리는 중...');
  const scale=180/72;
  const vp=page.getViewport({scale});
  const cv=document.createElement('canvas');
  cv.width=vp.width; cv.height=vp.height;
  const ctx=cv.getContext('2d');
  await page.render({canvasContext:ctx, viewport:vp}).promise;
  const txt=await page.getTextContent();
  // 제목으로 선적/양하 판별
  const allText=txt.items.map(i=>i.str).join(' ').toUpperCase();
  const kind = allText.includes('DISCHARG') ? 'disch'
             : allText.includes('STOW') ? 'stow' : null;
  // 베이 위치 + 라벨
  const bays=[];
  txt.items.forEach((it,idx)=>{
    if(it.str.trim()==='BAY'){
      const x=it.transform[4]*scale, y=(vp.height/scale - it.transform[5])*scale;
      // 같은 줄 오른쪽 토큰 모으기
      let lbl='BAY';
      for(let j=idx+1;j<txt.items.length;j++){
        const t=txt.items[j];
        const tx=t.transform[4]*scale, ty=(vp.height/scale-t.transform[5])*scale;
        if(Math.abs(ty-y)<8 && tx>x && tx<x+150){ lbl+=' '+t.str.trim(); }
      }
      bays.push({x,y,label:lbl.replace(/\s+/g,' ').trim()});
    }
  });
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  // 선박명: 제목 다음 큰 텍스트. "DONGJIN CONTINENTAL" 등. VOY 앞 토큰들 추정
  let vessel='';
  const tline=txt.items.map(i=>i.str).join(' ');
  const vm=tline.match(/(?:INSTRUCTION|PLAN)\s+([A-Z][A-Z ]{3,30}?)\s+VOY/i);
  if(vm) vessel=vm[1].trim();
  return {canvas:cv, ctx, img, bays, kind, w:cv.width, h:cv.height, vessel};
}

async function readImage(file){
  // 사진: 캔버스에 그려서 같은 픽셀 분석 (텍스트/베이 라벨 없음 → 격자만)
  const url=URL.createObjectURL(file);
  const im=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
  const cv=document.createElement('canvas');
  const maxW=1600; const sc=Math.min(1,maxW/im.width);
  cv.width=im.width*sc; cv.height=im.height*sc;
  const ctx=cv.getContext('2d');
  ctx.drawImage(im,0,0,cv.width,cv.height);
  URL.revokeObjectURL(url);
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  return {canvas:cv, ctx, img, bays:[], kind:null, w:cv.width, h:cv.height, isPhoto:true};
}

// 색 무관 그레이스케일 판정
function gray(img,x,y){
  const i=(y*img.width+x)*4;
  return (img.data[i]+img.data[i+1]+img.data[i+2])/3;
}
// ============ 셀 격자 검출 (검은선 둘러싸인 사각형) ============
function findCells(img){
  const W=img.width,H=img.height;
  const N=W*H;
  const dark=new Uint8Array(N);
  for(let i=0,p=0;p<N;p++){ const r=img.data[p*4],g=img.data[p*4+1],b=img.data[p*4+2];
    dark[p]= ((r+g+b)/3)<140 ? 0:1; } // 1=밝음, 0=선
  const seen=new Uint8Array(N);
  const cells=[];
  const stack=new Int32Array(40000); // 고정 버퍼
  for(let p=0;p<N;p++){
    if(dark[p]!==1 || seen[p]) continue;
    let sp=0; stack[sp++]=p; seen[p]=1;
    let minx=p%W,maxx=minx,miny=(p/W)|0,maxy=miny,cnt=0;
    while(sp>0){
      const q=stack[--sp]; cnt++;
      const qx=q%W, qy=(q/W)|0;
      if(qx<minx)minx=qx; if(qx>maxx)maxx=qx; if(qy<miny)miny=qy; if(qy>maxy)maxy=qy;
      // 4방향
      let n;
      n=q-1; if(qx>0   && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
      n=q+1; if(qx<W-1 && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
      n=q-W; if(qy>0   && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
      n=q+W; if(qy<H-1 && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
    }
    const w=maxx-minx, h=maxy-miny;
    if(cnt>=300 && cnt<3000 && w>=26&&w<=64 && h>=14&&h<=38){
      cells.push({x0:minx,y0:miny,x1:maxx,y1:maxy});
    }
  }
  return cells;
}

// 셀 상태: 빈칸 / 채움(사선=20, 무사선=40). 우리화물 여부는 플랜파일로 구분.
function cellState(img,c){
  const pad=3;
  let darkN=0, tot=0;
  const xs=c.x0+pad, xe=c.x1-pad, ys=c.y0+pad, ye=c.y1-pad;
  for(let y=ys;y<ye;y++)for(let x=xs;x<xe;x++){ tot++; if(gray(img,x,y)<130) darkN++; }
  if(tot===0||darkN/tot<0.03) return '.';
  // 사선: anti-diagonal 코너(bottom-left + top-right)
  const w=xe-xs,h=ye-ys; let bl=0,tr=0;
  for(let y=ys;y<ye;y++)for(let x=xs;x<xe;x++){
    if(gray(img,x,y)>=130) continue;
    const yn=(y-ys)/h, xn=(x-xs)/w;
    if(yn>0.55&&xn<0.45) bl++;
    if(yn<0.45&&xn>0.55) tr++;
  }
  const slash = bl>4 && tr>4;
  return slash?'F20':'F40';
}

// 베이별 셀 묶기 + 티어/로우 격자 정렬
function buildBay(img,cells,bay){
  const bx=bay.x;
  const near=cells.filter(c=>{
    const cx=(c.x0+c.x1)/2, cy=(c.y0+c.y1)/2;
    return cx>bx-70 && cx<bx+360 && cy>bay.y+10 && cy<bay.y+340;
  });
  if(!near.length) return null;
  // 티어밴드: cy 클러스터
  const cys=near.map(c=>(c.y0+c.y1)/2).sort((a,b)=>a-b);
  const bands=[]; let grp=[cys[0]];
  for(let i=1;i<cys.length;i++){ if(cys[i]-grp[grp.length-1]>14){bands.push(avg(grp)); grp=[cys[i]];} else grp.push(cys[i]); }
  bands.push(avg(grp));
  // 로우: cx 클러스터
  const cxs=near.map(c=>(c.x0+c.x1)/2).sort((a,b)=>a-b);
  const cols=[]; grp=[cxs[0]];
  for(let i=1;i<cxs.length;i++){ if(cxs[i]-grp[grp.length-1]>20){cols.push(avg(grp)); grp=[cxs[i]];} else grp.push(cxs[i]); }
  cols.push(avg(grp));
  // 해치커버 갭으로 deck/hold 분리
  let split=0,maxgap=0;
  for(let i=0;i<bands.length-1;i++){ const g=bands[i+1]-bands[i]; if(g>maxgap){maxgap=g; split=i;} }
  // 셀을 (band,col) 매핑
  const grid={};
  for(const c of near){
    const cx=(c.x0+c.x1)/2, cy=(c.y0+c.y1)/2;
    let ti=0,bd=1e9; bands.forEach((b,i)=>{if(Math.abs(b-cy)<bd){bd=Math.abs(b-cy);ti=i;}});
    let ci=0,cd=1e9; cols.forEach((cc,i)=>{if(Math.abs(cc-cx)<cd){cd=Math.abs(cc-cx);ci=i;}});
    grid[ti+'_'+ci]={state:cellState(img,c), band:ti, col:ci, cell:c};
  }
  return {grid, bands, cols, split, label:bay.label};
}
function avg(a){return a.reduce((s,v)=>s+v,0)/a.length;}
// ============ 그리드 → 콘엔진 입력(deck/hold tiers) ============
function gridToTiers(bayObj){
  // band 0=맨위 티어. split이하=deck, 초과=hold. 티어번호는 deck: 위에서부터 ...88,86,84,82 / hold 위 08,06,04,02
  // 콘엔진은 tier 숫자 클수록 위. 받침은 t-2. 여기선 band index를 티어로 환산.
  const odd = (bayObj.label.match(/\d+/g)||[]).length===1 && parseInt((bayObj.label.match(/\d+/)||[0])[0])%2===1;
  const deck={}, hold={};
  const nBands=bayObj.bands.length;
  for(const k in bayObj.grid){
    const g=bayObj.grid[k];
    if(g.state==='.') continue;
    const isDeck = g.band<=bayObj.split;
    // 티어 숫자: 아래일수록 작게. deck 영역 band가 클수록(아래) 티어 작게.
    // deck band range: 0..split  -> 티어 = (split-band)*2 + 82  (최저=82)
    // hold band range: split+1..nBands-1 -> 티어 = (nBands-1-band)*2 + 2
    let tier, sz;
    if(isDeck){ tier = (bayObj.split - g.band)*2 + 82; }
    else { tier = (nBands-1 - g.band)*2 + 2; }
    // 사이즈: 홀수베이는 채움이면 무조건 20ft. X(우리화물아님)은 받침으로만 쓰되 콘계산 제외.
    if(g.state==='F20') sz='O20';
    else sz = odd ? 'O20' : 'O40';
    const tgt=isDeck?deck:hold;
    if(!tgt[tier]) tgt[tier]={};
    tgt[tier][k.split('_')[1]]=sz; // col index as row key (받침 비교용으로 일관)
  }
  return {deck,hold};
}

// 전체 플랜 → 베이별 콘
function analyzePlan(plan,shipType){
  if(!plan || !plan.bays.length) return {};
  const cells=findCells(plan.img);
  const res={};
  for(const bay of plan.bays){
    const bo=buildBay(plan.img,cells,bay);
    if(!bo) continue;
    const {deck,hold}=gridToTiers(bo);
    const cones=calcCones(deck,hold,shipType);
    res[bay.label]={cones, bayObj:bo, group:bayGroupKey(bay.label)};
  }
  return res;
}

// 선적-양하 차감 → 베이그룹별 결과
function computeResult(stowRes, dischRes){
  const groups={};
  function add(res,which){
    for(const lbl in res){
      const gk=res[lbl].group;
      if(!groups[gk]) groups[gk]={stow:{deck:0,ele:0,hold:0}, disch:{deck:0,ele:0,hold:0}, labels:[]};
      const c=res[lbl].cones;
      groups[gk][which].deck+=c.deck; groups[gk][which].ele+=c.ele; groups[gk][which].hold+=c.hold;
      if(!groups[gk].labels.includes(lbl)) groups[gk].labels.push(lbl);
    }
  }
  add(stowRes,'stow'); add(dischRes,'disch');
  return groups;
}

function enableZoom(on){
  const vp=document.querySelector('meta[name="viewport"]');
  if(!vp) return;
  vp.setAttribute('content', on
    ? 'width=device-width, initial-scale=1.0'                       // 줌 허용
    : 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');  // 원복
}

async function handleFile(file,slot){
  if(!file) return;
  const name=(file.name||'').toLowerCase();
  showLoading('읽는 중... ('+(file.name||'파일')+')');
  try{
    const isPdf = file.type==='application/pdf' || name.endsWith('.pdf');
    const isImg = (file.type||'').startsWith('image/') || /\.(jpe?g|png|gif|webp|heic)$/.test(name);

    // PDF
    if(isPdf){
      const data=await readPDF(file);
      if(data.kind && data.kind!==slot) slot=data.kind;
      state[slot]=data; applyVessel(data.vessel); render(); return;
    }
    // 이미지
    if(isImg){
      const data=await readImage(file);
      state[slot]=data; render(); return;
    }
    // 그 외 전부 텍스트로 읽어 EDI인지 내용으로 판별 (확장자 무관)
    const text=await file.text();
    if(isEDI(text)){
      const d=parseEDI(text);
      if(d.kind && d.kind!==slot) slot=d.kind;
      state[slot]={ediRows:d.rows, isEDI:true, fname:file.name, vessel:d.vessel};
      applyVessel(d.vessel); render(); return;
    }
    // 텍스트인데 EDI 아님
    showErr(slot, '이 파일은 EDI 형식이 아닙니다. EDI(BAPLIE) 또는 PDF·사진을 올려주세요. (읽은 파일: '+(file.name||'?')+')');
  }catch(err){
    showErr(slot, '파일을 읽지 못했습니다: '+err.message+' (파일: '+(file.name||'?')+')');
  }
}
function showErr(slot,msg){

function planToGroups(plan){
  if(!plan) return {};
  if(plan.isEDI) return ediToBayGroups(plan.ediRows, state.shipType);
  if(!plan.bays || !plan.bays.length){
    // 사진이거나 베이 텍스트를 못읽음 → 빈 결과(사용자에게 안내됨)
    return {};
  }
  const res=analyzePlan(plan, state.shipType);
  const groups={};
  for(const lbl in res){
    const gk=res[lbl].group; const c=res[lbl].cones;
    if(!groups[gk]) groups[gk]={deck:0,ele:0,hold:0};
    groups[gk].deck+=c.deck; groups[gk].ele+=c.ele; groups[gk].hold+=c.hold;
  }
  return groups;
}
function runCalc(){
  showLoading('계산 중...');
  setTimeout(()=>{
    try{
      // 양하/선적 선박명 다르면 경고(다른 항차 자료일 수 있음)
      const vs=state.stow&&state.stow.vessel, vd=state.disch&&state.disch.vessel;
      const norm=s=>(s||'').toUpperCase().replace(/\s+/g,'');
      window.__vesselWarn = (vs&&vd&&norm(vs)!==norm(vd)) ? ('⚠ 양하('+vd+')와 선적('+vs+') 선박명이 다릅니다. 같은 항차 자료인지 확인하세요.') : '';
      const sg=planToGroups(state.stow);
      const dg=planToGroups(state.disch);
      const allk=new Set([...Object.keys(sg),...Object.keys(dg)].map(Number));
      const groups={};
      for(const k of allk){
        groups[k]={
          stow: sg[k]||{deck:0,ele:0,hold:0},
          disch: dg[k]||{deck:0,ele:0,hold:0},
          labels:[k+'번']
        };
      }

      document.getElementById('resultArea').innerHTML=
        `<div class="card"><p style="color:var(--rem)">계산 오류: ${err.message}</p></div>`;
    }
  },50);
}

// ============ 베이 위치 보기 (양하·선적 구분) ============
// 콘앱이 이미 가진 EDI 위치값(bay/row/tier/size)만으로 베이별 격자를 그린다.
// 베이사전 불필요. 양하=파랑, 선적=초록, 둘 다=주황.
// ===== 카고플랜 모듈 (검수앱 cargoPlanCore + PrintableCargoPlanV2 포팅) =====
// ============================================================
// 카고플랜 코어 — 검수앱 cargoPlanCore.js 포팅 (콘앱용, 빈 골격)
// CASPI 방식: 컨테이너 좌표 → baysSummary → 레이아웃 → 격자.
// 표기(컨번호·마크) 없이 검수앱과 동일한 베이 골격만 그린다.
// ============================================================

const STANDARD_DECK = [94, 92, 90, 88, 86, 84, 82, 80];
const STANDARD_HOLD = [14, 12, 10, 8, 6, 4, 2];

// 좌표(rows: {bay,row,tier,...}) → baysSummary (ascToBayDictEntry 골격부 포팅)
function rowsToBaysSummary(rows){
  const bayMap = {};
  for(const c of rows){
    const bayNo = parseInt(c.bay, 10);
    if(!Number.isFinite(bayNo)) continue;
    const row = parseInt(c.row, 10);
    const tier = parseInt(c.tier, 10);
    if(!Number.isFinite(row) || !Number.isFinite(tier)) continue;
    if(!bayMap[bayNo]) bayMap[bayNo] = { rowsEven:new Set(), rowsOdd:new Set(), holdTiers:new Set(), deckTiers:new Set() };
    const b = bayMap[bayNo];
    if(row % 2 === 0 && row !== 0) b.rowsEven.add(row); else b.rowsOdd.add(row);
    if(tier <= 20) b.holdTiers.add(tier); else b.deckTiers.add(tier);
  }
  const sortedBays = Object.keys(bayMap).map(Number).sort((a,b)=>a-b);
  const baysSummary = [];
  for(const bayNo of sortedBays){
    const b = bayMap[bayNo];
    const deckTiers = Array.from(b.deckTiers).sort((a,b)=>b-a);
    const holdTiers = Array.from(b.holdTiers).sort((a,b)=>b-a);
    const isEven = bayNo % 2 === 0;
    const isStandalone = isEven && !bayMap[bayNo-1] && !bayMap[bayNo+1];
    const rowMaxEven = b.rowsEven.size>0 ? Math.max(...b.rowsEven) : null;
    const rowMaxOdd = b.rowsOdd.size>0 ? Math.max(...b.rowsOdd) : null;
    const entry = {
      bayNo: String(bayNo).padStart(2,'0'),
      hasHold: holdTiers.length>0, hasDeck: deckTiers.length>0, isStandalone,
      deckTiers, holdTiers,
    };
    if(rowMaxEven!=null){ entry.rowMaxEven = rowMaxEven; }
    if(rowMaxOdd!=null){ entry.rowMaxOdd = rowMaxOdd; }
    baysSummary.push(entry);
  }
  return baysSummary;
}

// baysSummary → matrixBays (검수앱 fallback 경로: cells 비움 → hull 가득)
function baysSummaryToMatrixBays(baysSummary, rows){
  // EDI/ASC tier로 deck/hold 보강
  const ediTiersByBay = new Map();
  for(const c of rows){
    const b = Number(c.bay), t = Number(c.tier);
    if(!Number.isFinite(b)||!Number.isFinite(t)) continue;
    if(!ediTiersByBay.has(b)) ediTiersByBay.set(b, new Set());
    ediTiersByBay.get(b).add(t);
  }
  const summaryByBay = new Map();
  for(const s of baysSummary){ const n=Number(s.bayNo); if(Number.isFinite(n)) summaryByBay.set(n,s); }

  return baysSummary.map(s=>{
    const bayNum = Number(s.bayNo);
    const summary = summaryByBay.get(bayNum);
    const tiers = ediTiersByBay.get(bayNum);
    const ediTiers = tiers ? [...tiers] : [];
    const hasDeckFromEdi = ediTiers.some(t=>t>=80);
    const hasHoldFromEdi = ediTiers.some(t=>t<80);
    const hasDeck = summary?.hasDeck !== undefined ? summary.hasDeck : (hasDeckFromEdi);
    const hasHold = summary?.hasHold !== undefined ? summary.hasHold : (hasHoldFromEdi);
    // 베이별 deck/hold tier (summary 우선, 없으면 EDI tier)
    const deckTiers = (summary?.deckTiers && summary.deckTiers.length>0) ? summary.deckTiers
      : ediTiers.filter(t=>t>=80).sort((a,b)=>b-a);
    const holdTiers = (summary?.holdTiers && summary.holdTiers.length>0) ? summary.holdTiers
      : ediTiers.filter(t=>t<80).sort((a,b)=>b-a);
    // row 폭: rowMax 기준. deckCells/holdCells = 각 tier 폭(빈 골격이므로 max row 수로 통일)
    const rowMaxEven = summary?.rowMaxEven || 0;
    const rowMaxOdd = summary?.rowMaxOdd || 0;
    // hasZero: deck max row가 홀수면 00 있음 (좌우대칭 + 가운데 00)
    const allRowsForBay = rows.filter(c=>Number(c.bay)===bayNum).map(c=>parseInt(c.row,10)).filter(Number.isFinite);
    const maxRow = allRowsForBay.length>0 ? Math.max(...allRowsForBay) : 0;
    const hasZero = allRowsForBay.includes(0) || (maxRow % 2 === 1);
    // 칸 수 = (max row / 2 올림) 좌우 + (00 있으면 +1). 빈 골격은 폭만 알면 됨.
    const widthCells = Math.max(rowMaxEven, rowMaxOdd, maxRow);
    const nCols = Math.ceil(widthCells/2) * 2 + (hasZero?1:0);  // 대략적 폭
    // deckCells/holdCells: 각 tier마다 nCols-(hasZero?1:0) 폭 (가득). 빈 골격.
    const fullWidth = hasZero ? nCols-1 : nCols;
    return {
      bayNum,
      hasDeck, hasHold, isStandalone: !!summary?.isStandalone, hasZero,
      deckTiers, holdTiers,
      // buildEmptyBayRenderData가 쓰는 필드
      _deckCellsWidth: fullWidth, _holdCellsWidth: fullWidth,
      rowMaxEven, rowMaxOdd,
    };
  });
}

// 짝꿍 자동 (검수앱 autoPairBays 포팅)
function autoPairBays(matrixBays){
  const byNum = new Map();
  matrixBays.forEach(b=>byNum.set(b.bayNum, b));
  const evens = matrixBays.map(b=>b.bayNum).filter(n=>n%2===0).sort((a,b)=>a-b);
  const odds = matrixBays.map(b=>b.bayNum).filter(n=>n%2===1).sort((a,b)=>a-b);
  const trios = [];
  const usedOdds = new Set(), usedEvens = new Set();
  for(const e of evens){
    if(byNum.has(e-1) && byNum.has(e+1)){
      const topKey = String(e-1).padStart(2,'0');
      const pairKey = `(${String(e).padStart(2,'0')})${String(e+1).padStart(2,'0')}`;
      trios.push([topKey, pairKey]);
      usedOdds.add(e-1); usedOdds.add(e+1); usedEvens.add(e);
    }
  }
  const unusedOdds = odds.filter(o=>!usedOdds.has(o));
  const orphanEvens = evens.filter(e=>!usedEvens.has(e));
  const singles = [...unusedOdds, ...orphanEvens].sort((a,b)=>a-b).map(n=>String(n).padStart(2,'0'));
  return { trios, singles };
}

// 페이지 레이아웃 (검수앱 autoPageLayout 포팅)
function autoPageLayout(trios, singles){
  const allBoxes = [];
  trios.forEach(([topKey,pairKey])=>{
    allBoxes.push({ type:'trio', oddNum:parseInt(topKey,10), topKey, pairKey });
  });
  singles.forEach(s=>{
    allBoxes.push({ type:'single', oddNum:parseInt(s,10), topKey:s, pairKey:null });
  });
  const n = allBoxes.length;
  if(n===0) return [];
  const topCount = Math.ceil((n+1)/2);
  const sortedAsc = [...allBoxes].sort((a,b)=>a.oddNum-b.oddNum);
  const topBoxes = sortedAsc.slice(0, topCount);
  const bottomBoxes = sortedAsc.slice(topCount);
  topBoxes.sort((a,b)=>b.oddNum-a.oddNum);
  bottomBoxes.sort((a,b)=>b.oddNum-a.oddNum);
  return bottomBoxes.length>0 ? [topBoxes, bottomBoxes] : [topBoxes];
}

// row 위치 라벨 (검수앱 getRowPositions 포팅)
function getRowPositions(cellCount, hasZero){
  if(cellCount<=0) return [];
  const pad = n=>String(n).padStart(2,'0');
  if(hasZero){
    const half = Math.floor((cellCount-1)/2);
    const evens=[]; for(let n=half*2;n>0;n-=2) evens.push(pad(n));
    const odds=[]; for(let n=1;n<=half*2-1;n+=2) odds.push(pad(n));
    return [...evens,'00',...odds];
  } else {
    const halfEvens = Math.floor(cellCount/2);
    const halfOdds = cellCount-halfEvens;
    const evens=[]; for(let n=halfEvens*2;n>0;n-=2) evens.push(pad(n));
    const odds=[]; for(let n=1;n<=halfOdds*2-1;n+=2) odds.push(pad(n));
    return [...evens,...odds];
  }
}

// active cols 대칭 (검수앱 getActiveColsSymmetric 포팅)
function getActiveColsSymmetric(cellCount, nTotal){
  const active = new Set();
  if(cellCount>=nTotal){ for(let i=0;i<nTotal;i++) active.add(i); return active; }
  if(cellCount<=0) return active;
  const center = Math.floor(nTotal/2);
  if(nTotal%2===1){
    if(cellCount%2===1){
      const half=Math.floor((cellCount-1)/2);
      for(let i=center-half;i<=center+half;i++) active.add(i);
    } else {
      const half=cellCount/2;
      for(let i=center-half+1;i<=center+half;i++) active.add(i);
    }
  } else {
    const half=Math.floor(cellCount/2);
    for(let i=center-half;i<center;i++) active.add(i);
    for(let i=center;i<center+half;i++) active.add(i);
    if(cellCount%2===1){ const extra=center+half; if(extra<nTotal) active.add(extra); }
  }
  return active;
}

// 검수앱 buildEmptyBayRenderData 정확 포팅 — baysSummary 엔트리(deckCells/holdCells)로
//   tier별 정확한 칸 수를 그린다. 베이사전이 있을 때 사용 → 검수앱과 동일 골격.
function buildBayRenderDataFromSummary(bayEntry, bayKey){
  if(!bayEntry) return null;
  const rowCount = bayEntry.rowCount!=null ? bayEntry.rowCount : 9;
  const hasZero = bayEntry.hasZero!==false;
  const deckTiers = (bayEntry.deckTiers||[]).map(Number);
  const holdTiers = (bayEntry.holdTiers||[]).map(Number);
  const deckCells = bayEntry.deckCells||[];
  const holdCells = bayEntry.holdCells||[];

  const _deckNums = deckCells.map(Number).filter(v=>!isNaN(v)&&v>0);
  const _deckMax = _deckNums.length>0 ? Math.max(..._deckNums) : 0;
  const _effDeckRows = _deckMax>0 ? _deckMax : rowCount;
  const nDeckCols = _effDeckRows + (hasZero?1:0);
  const _holdNums = holdCells.map(Number).filter(v=>!isNaN(v)&&v>0);
  const _holdMax = _holdNums.length>0 ? Math.max(..._holdNums) : 0;
  const nHoldCols = _holdMax>0 ? Math.min(_holdMax+(hasZero?1:0), nDeckCols) : nDeckCols;
  const deckRowPos = getRowPositions(nDeckCols, hasZero);
  const holdRowPos = getRowPositions(nHoldCols, hasZero);

  const deckRows = STANDARD_DECK.map(stdT=>{
    const di = deckTiers.indexOf(stdT);
    if(di>=0){
      const cc = di<deckCells.length ? Number(deckCells[di]) : 0;
      const active = getActiveColsSymmetric(cc, nDeckCols);
      const cells=[];
      for(let c=0;c<nDeckCols;c++) cells.push({active:active.has(c), rowLbl:active.has(c)?deckRowPos[c]:null});
      return { tier:stdT, invisible:false, cells };
    }
    return { tier:stdT, invisible:true, cells:new Array(nDeckCols).fill(0).map(()=>({active:false,rowLbl:null})) };
  });
  const holdRows = STANDARD_HOLD.map(stdT=>{
    const hi = holdTiers.indexOf(stdT);
    if(hi>=0){
      const cc = hi<holdCells.length ? Number(holdCells[hi]) : 0;
      const active = getActiveColsSymmetric(cc, nHoldCols);
      const cells=[];
      for(let c=0;c<nHoldCols;c++) cells.push({active:active.has(c), rowLbl:active.has(c)?holdRowPos[c]:null});
      return { tier:stdT, invisible:false, cells };
    }
    return { tier:stdT, invisible:true, cells:new Array(nHoldCols).fill(0).map(()=>({active:false,rowLbl:null})) };
  });

  return {
    bayKey, deckTiers, holdTiers, nDeck:deckTiers.length, nHold:holdTiers.length, hasZero,
    deckRowPos, holdRowPos, nDeckCols, nHoldCols, deckRows, holdRows,
  };
}

// 빈 베이 렌더 데이터 (검수앱 buildEmptyBayRenderData 포팅, 빈 골격)
function buildBayRenderData(bay, bayKey){
  if(!bay) return null;
  const deckTiers = (bay.deckTiers||[]).map(Number);
  const holdTiers = (bay.holdTiers||[]).map(Number);
  const hasZero = !!bay.hasZero;
  const fullWidth = bay._deckCellsWidth || 8;
  const nDeckCols = fullWidth + (hasZero?1:0);
  const holdWidth = bay._holdCellsWidth || fullWidth;
  const nHoldCols = Math.min(holdWidth + (hasZero?1:0), nDeckCols);
  const deckRowPos = getRowPositions(nDeckCols, hasZero);
  const holdRowPos = getRowPositions(nHoldCols, hasZero);

  // deck rows: STANDARD_DECK 순회, tier 있으면 active 가득, 없으면 invisible
  const deckRows = STANDARD_DECK.map(stdT=>{
    if(deckTiers.includes(stdT)){
      const active = getActiveColsSymmetric(fullWidth, nDeckCols);  // 가득
      const cells=[];
      for(let c=0;c<nDeckCols;c++) cells.push({active:active.has(c), rowLbl:active.has(c)?deckRowPos[c]:null});
      return { tier:stdT, invisible:false, cells };
    }
    return { tier:stdT, invisible:true, cells:new Array(nDeckCols).fill(0).map(()=>({active:false,rowLbl:null})) };
  });
  const holdRows = STANDARD_HOLD.map(stdT=>{
    if(holdTiers.includes(stdT)){
      const active = getActiveColsSymmetric(holdWidth, nHoldCols);
      const cells=[];
      for(let c=0;c<nHoldCols;c++) cells.push({active:active.has(c), rowLbl:active.has(c)?holdRowPos[c]:null});
      return { tier:stdT, invisible:false, cells };
    }
    return { tier:stdT, invisible:true, cells:new Array(nHoldCols).fill(0).map(()=>({active:false,rowLbl:null})) };
  });

  return {
    bayKey, deckTiers, holdTiers, nDeck:deckTiers.length, nHold:holdTiers.length, hasZero,
    deckRowPos, holdRowPos, nDeckCols, nHoldCols, deckRows, holdRows,
  };
}

// 전체 파이프라인: 좌표 rows → 렌더에 필요한 모든 것
//   dictBaysSummary(검수앱 베이사전)가 있으면 그걸로 검수앱과 동일 골격.
//   없으면 좌표 역산(폴백).
function buildCargoPlan(rows, dictBaysSummary){
  const useDict = Array.isArray(dictBaysSummary) && dictBaysSummary.length>0;
  // matrixBays 구성: 베이사전 우선
  let matrixBays;
  if(useDict){
    matrixBays = dictBaysSummary
      .map(s=>({ bayNum: parseInt(s.bayNo!=null?s.bayNo:s.bay,10), _summary:s }))
      .filter(b=>Number.isFinite(b.bayNum) && b.bayNum>0)
      .sort((a,b)=>a.bayNum-b.bayNum);
  } else {
    const baysSummary = rowsToBaysSummary(rows);
    matrixBays = baysSummaryToMatrixBays(baysSummary, rows);
  }
  if(matrixBays.length===0) return null;
  const { trios, singles } = autoPairBays(matrixBays);
  const layout = autoPageLayout(trios, singles);
  const byNum = new Map(); matrixBays.forEach(b=>byNum.set(b.bayNum,b));
  const renderDataMap = {};
  const keyToNum = key => key.startsWith('(') ? parseInt(key.replace('(','').replace(')','').slice(2),10) : parseInt(key,10);
  for(const rowBoxes of layout){
    for(const box of rowBoxes){
      [box.topKey, box.pairKey].filter(Boolean).forEach(k=>{
        const num = keyToNum(k);
        const b = byNum.get(num);
        renderDataMap[k] = useDict && b && b._summary
          ? buildBayRenderDataFromSummary(b._summary, k)   // 검수앱과 동일 골격
          : buildBayRenderData(b, k);                       // 좌표 역산 폴백
      });
    }
  }
  let globalMaxCols=1;
  for(const d of Object.values(renderDataMap)){
    if(d&&d.nDeckCols>globalMaxCols) globalMaxCols=d.nDeckCols;
    if(d&&d.nHoldCols>globalMaxCols) globalMaxCols=d.nHoldCols;
  }
  return { layout, renderDataMap, globalMaxCols };
}

function _buildCargoPlan_OLD(rows){
  const baysSummary = rowsToBaysSummary(rows);
  const matrixBays = baysSummaryToMatrixBays(baysSummary, rows);
  if(matrixBays.length===0) return null;
  const { trios, singles } = autoPairBays(matrixBays);
  const layout = autoPageLayout(trios, singles);
  // 각 베이 키별 렌더 데이터
  const byNum = new Map(); matrixBays.forEach(b=>byNum.set(b.bayNum,b));
  const renderDataMap = {};
  const keyToNum = key => key.startsWith('(') ? parseInt(key.replace('(','').replace(')','').slice(2),10) : parseInt(key,10);
  for(const rowBoxes of layout){
    for(const box of rowBoxes){
      [box.topKey, box.pairKey].filter(Boolean).forEach(k=>{
        const num = keyToNum(k);
        renderDataMap[k] = buildBayRenderData(byNum.get(num), k);
      });
    }
  }
  // 전역 최대 칸 수 (셀 폭 통일)
  let globalMaxCols=1;
  for(const d of Object.values(renderDataMap)){
    if(d?.nDeckCols>globalMaxCols) globalMaxCols=d.nDeckCols;
    if(d?.nHoldCols>globalMaxCols) globalMaxCols=d.nHoldCols;
  }
  return { layout, renderDataMap, globalMaxCols };
}

// padding 계산 (검수앱 computePadding center 포팅)
function _computePadding(smallerN, biggerN){
  const diff = biggerN - smallerN;
  if(diff<=0) return { paddingLeft:'0', paddingRight:'0' };
  return { paddingLeft:`${(diff/2)/biggerN*100}%`, paddingRight:`${(diff/2)/biggerN*100}%` };
}

// 한 격자(deck 또는 hold) HTML
function _gridHtml(rows, rowPos, nCols, stdTiers, gc){
  const pad = _computePadding(nCols, gc);
  const padStyle = `padding-left:${pad.paddingLeft};padding-right:${pad.paddingRight}`;
  let gridRows = '';
  for(const row of rows){
    let cells='';
    for(const cell of row.cells){
      if(!cell.active) cells += '<span class="cpv2-cell-empty"></span>';
      else cells += '<span class="cpv2-cell"></span>';
    }
    gridRows += `<div class="cpv2-tier-row${row.invisible?' cpv2-invisible-row':''}">${cells}</div>`;
  }
  let tierLabels='';
  for(const t of stdTiers){
    const visible = rows.some(r=>!r.invisible && r.tier===t);
    tierLabels += `<span class="${visible?'':'cpv2-invisible-label'}">${String(t).padStart(2,'0')}</span>`;
  }
  return `<div class="cpv2-grid-row-wrap">
    <div class="cpv2-grid" style="${padStyle}">${gridRows}</div>
    <div class="cpv2-tier-labels">${tierLabels}</div>
  </div>`;
}

// 한 베이 박스 (BayBoxV2 포팅)
function _bayBoxHtml(data, gc, applyHatch){
  if(!data) return '<div class="cpv2-bay-section"></div>';
  const { bayKey, deckTiers, holdTiers, nHold, nDeckCols, nHoldCols, deckRowPos, holdRowPos, deckRows, holdRows } = data;
  const deckPad = _computePadding(nDeckCols, gc);
  const holdPad = _computePadding(nHoldCols, gc);
  const deckPadStyle = `padding-left:${deckPad.paddingLeft};padding-right:${deckPad.paddingRight}`;
  const holdPadStyle = `padding-left:${holdPad.paddingLeft};padding-right:${holdPad.paddingRight}`;

  const deckRowLabels = deckRowPos.map(rl=>`<span>${rl}</span>`).join('');
  const holdRowLabels = holdRowPos.map(rl=>`<span>${rl}</span>`).join('');

  let html = `<div class="cpv2-bay-section">
    <div class="cpv2-bay-title-row"><span class="cpv2-bay-title">BAY ${bayKey}</span></div>
    <div class="cpv2-bay-content">
      <div class="cpv2-deck-area" style="flex:${Math.max(deckTiers.length,1)} 1 0">
        <div class="cpv2-row-labels" style="${deckPadStyle}">${deckRowLabels}</div>
        ${_gridHtml(deckRows, deckRowPos, nDeckCols, [94,92,90,88,86,84,82,80], gc)}
      </div>`;
  if(nHold>0){
    const segs = (applyHatch ? Math.max(1,Math.min(3,1)) : 1);
    let hatch=''; for(let i=0;i<segs;i++) hatch+='<div class="cpv2-hatch-seg"></div>';
    html += `<div class="cpv2-hatch-break">${hatch}</div>
      <div class="cpv2-hold-area" style="flex:${Math.max(holdTiers.length,1)} 1 0">
        ${_gridHtml(holdRows, holdRowPos, nHoldCols, [14,12,10,8,6,4,2], gc)}
        <div class="cpv2-row-labels" style="${holdPadStyle}">${holdRowLabels}</div>
      </div>`;
  }
  html += `</div></div>`;
  return html;
}

// 전체 카고플랜 페이지 HTML (mode: 'disch'|'stow')
function renderCargoPlanHtml(rows, shipName, voyNo, mode, dictBaysSummary){
  const plan = buildCargoPlan(rows, dictBaysSummary);
  if(!plan) return '<div style="padding:20px;color:#fff">표시할 컨테이너가 없습니다.</div>';
  const { layout, renderDataMap, globalMaxCols } = plan;
  const gc = globalMaxCols;
  const title = `${(shipName||'').toUpperCase()} CARGO ${mode==='disch'?'DISCHARGING':'LOADING'} PLAN`;
  const today = new Date().toISOString().slice(0,10);

  const topLen = layout[0] ? layout[0].length : 0;
  let pageRows='';
  layout.forEach((row, ri)=>{
    const isLast = ri===layout.length-1, isFirst = ri===0;
    const emptySlots = (isLast && !isFirst) ? Math.max(0, topLen-row.length) : 0;
    let slots='';
    for(let i=0;i<emptySlots;i++) slots += '<div class="cpv2-bay-box cpv2-empty-slot"></div>';
    for(const box of row){
      if(box.type==='trio'){
        const topData = renderDataMap[box.topKey];
        const pairData = renderDataMap[box.pairKey];
        slots += `<div class="cpv2-bay-box">
          ${_bayBoxHtml(topData, gc, false)}
          <div class="cpv2-trio-divider"></div>
          ${_bayBoxHtml(pairData, gc, false)}
        </div>`;
      } else {
        const d = renderDataMap[box.topKey];
        slots += `<div class="cpv2-bay-box">${_bayBoxHtml(d, gc, true)}</div>`;
      }
    }
    pageRows += `<div class="cpv2-page-row">${slots}</div>`;
  });

  return `<style>${CARGO_V2_CSS}</style>
  <div class="cpv2-wrap">
    <div class="cpv2-page">
      <div class="cpv2-page-header">
        <div class="col">VOY NO : ${voyNo||''}</div>
        <div class="title-center">${title}</div>
        <div class="col">DATE : ${today}</div>
      </div>
      <div class="cpv2-page-rows">${pageRows}</div>
    </div>
  </div>`;
}



function renderBayView(){

  // 컨테이너 수집: bay → { 'row_tier': {d:양하?, l:선적?, size} }
  const bays={};
  const add=(rows,flag)=>{
    if(!rows) return;
    for(const r of rows){
      const b=parseInt(r.bay,10); if(!Number.isFinite(b)) continue;
      if(!bays[b]) bays[b]={};
      const key=r.row+'_'+r.tier;
      if(!bays[b][key]) bays[b][key]={d:false,l:false,size:r.size,row:r.row,tier:r.tier};
      bays[b][key][flag]=true;
    }
  };
  add(state.disch&&state.disch.ediRows,'d');
  add(state.stow&&state.stow.ediRows,'l');

  const bayKeys=Object.keys(bays).map(Number).sort((a,b)=>a-b);
  if(!bayKeys.length){ ra.innerHTML='<div class="card"><div class="empty-note">표시할 컨테이너가 없습니다.</div></div>'; return; }

  const shipLabel=state.shipName||'선박';

      <span class="bv-lg b">양하+선적</span>
      <span class="bv-lg" style="color:var(--dim)">○20ft ●40ft</span>
    </div>`;

  for(const bk of bayKeys){
    const cells=bays[bk];
    // tier 목록(위→아래), row 목록(좌→우: 짝수 내림 + 00 + 홀수 오름 = 선박 단면 통상 배열)
    const tiers=[...new Set(Object.values(cells).map(c=>parseInt(c.tier,10)))].sort((a,b)=>b-a);

    const evens=rowsSet.filter(r=>parseInt(r,10)%2===0 && r!=='00').sort((a,b)=>parseInt(b)-parseInt(a));
    const zero=rowsSet.filter(r=>r==='00');
    const odds=rowsSet.filter(r=>parseInt(r,10)%2===1).sort((a,b)=>parseInt(a)-parseInt(b));
    const rowOrder=[...evens,...zero,...odds];
    const deckTiers=tiers.filter(t=>t>=80), holdTiers=tiers.filter(t=>t<80);

    const cnt={d:0,l:0,b:0};
    Object.values(cells).forEach(c=>{ if(c.d&&c.l)cnt.b++; else if(c.d)cnt.d++; else if(c.l)cnt.l++; });

    html+=`<div class="bv-bay"><div class="bv-bayhd">BAY ${String(bk).padStart(2,'0')}
      <span class="bv-cnt">양하 ${cnt.d} · 선적 ${cnt.l}${cnt.b?(' · 공통 '+cnt.b):''}</span></div>`;
    const grid=(tierList,label)=>{
      if(!tierList.length) return '';
      let g=`<div class="bv-sec">${label}</div><table class="bv-tab"><tbody>`;
      for(const t of tierList){
        g+='<tr>';
        for(const r of rowOrder){
          const c=cells[r+'_'+t];
          if(!c){ g+='<td class="bv-empty"></td>'; continue; }
          const cls=c.d&&c.l?'b':(c.d?'d':'l');
          const dot=c.size==='40'?'●':'○';
          g+=`<td class="bv-c ${cls}" title="row ${r} tier ${t}">${dot}</td>`;
        }
        g+='</tr>';
      }
      g+='</tbody></table>';
      return g;
    };
    html+=grid(deckTiers,'갑판 (Deck)');
    html+=grid(holdTiers,'선창 (Hold)');
    html+='</div>';
  }
  html+='</div>';
  ra.innerHTML=html;
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderResults(groups){
  const ra=document.getElementById('resultArea');
  const keys=Object.keys(groups).map(Number).sort((a,b)=>a-b)
    .filter(k=>{const g=groups[k];return (g.stow.deck+g.stow.ele+g.stow.hold+g.disch.deck+g.disch.ele+g.disch.hold)>0;});
  if(!keys.length){ ra.innerHTML='<div class="card"><div class="empty-note">인식된 베이가 없습니다. EDI를 쓰거나, 사진이면 더 또렷하게 찍어주세요.</div></div>'; return; }

  // 행 데이터 만들기
  const rows=keys.map(k=>{
    const g=groups[k];
    const sd=distribute(g.stow), dd=distribute(g.disch);
    return {
      bay:k,
      deck:{need:sd.deckPer, have:dd.deckPer, diff:sd.deckPer-dd.deckPer},
      ele:{need:sd.elePer, have:dd.elePer, diff:sd.elePer-dd.elePer},
      hold:{need:g.stow.hold*2, have:g.disch.hold*2, diff:g.stow.hold*2-g.disch.hold*2},
    };
  });

  const shipLabel = state.shipName ? state.shipName : '선박 미입력';
  const today=new Date().toLocaleDateString('ko-KR');

  let html='';
  if(window.__vesselWarn){ html+=`<div class="card" style="border-color:var(--rem)"><p style="color:var(--rem);margin:0;font-size:14px">${window.__vesselWarn}</p></div>`; }
  html+=`<div class="confirm-bar"><p><b>⚠ 인식 결과 확인</b> — 콘 작업 전 반드시 대조하세요.</p></div>`;

  html+=`<div class="card" id="shareCard">
    <div class="share-head">
      <div class="sh-title">콘 작업표</div>
      <div class="sh-sub">${shipLabel} · ${today} · ${state.shipType==='container'?'컨테이너선':'일반/복합선'}</div>
    </div>
    <table class="ctab">
      <thead><tr><th>베이</th><th>데크콘<br><small>4곳·곳당</small></th><th>코끼리콘<br><small>중간·곳당</small></th><th>홀드콘<br><small>중간</small></th></tr></thead>
      <tbody>`;
  for(const r of rows){
    html+=`<tr>
      <td class="bay-c">${r.bay}</td>
      ${cell(r.deck)}${cell(r.ele)}${cell(r.hold)}
    </tr>`;
  }
  html+=`</tbody></table>
    <div class="legend"><span class="lg add">초록 +추가</span><span class="lg rem">빨강 −반납</span><span class="lg keep">회색 그대로</span></div>
  </div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn-share" id="btnImg">📷 이미지 저장</button>
    <button class="btn-share" id="btnTxt">📋 텍스트 복사</button>
  </div>`;
  ra.innerHTML=html;

  document.getElementById('btnImg').onclick=()=>saveImage(rows,shipLabel,today);
  document.getElementById('btnTxt').onclick=()=>copyText(rows,shipLabel,today);
}

function cell(c){
  if(c.need===0&&c.have===0) return '<td class="keep-c">·</td>';
  let cls,txt;
  if(c.diff>0){cls='add';txt='+'+c.diff;}
  else if(c.diff<0){cls='rem';txt='−'+(-c.diff);}
  else {cls='keep';txt='0';}
  return `<td class="${cls}-c"><span class="big">${txt}</span><span class="sub">${c.have}→${c.need}</span></td>`;
}

function copyText(rows,ship,today){
  let t=`[콘 작업표] ${ship} ${today}\n`;
  t+=`(콘: 데크/코끼리/홀드, +추가 −반납)\n`;
  for(const r of rows){
    const f=(c)=> c.diff>0?`+${c.diff}`:c.diff<0?`-${-c.diff}`:'0';
    t+=`${r.bay}번: 데크${f(r.deck)} 코끼리${f(r.ele)} 홀드${f(r.hold)}\n`;
  }
  navigator.clipboard.writeText(t).then(()=>alert('복사됐습니다. 카톡에 붙여넣으세요.'),
    ()=>{ prompt('아래를 복사하세요:',t); });
}

function saveImage(rows,ship,today){
  // 캔버스에 표를 그려 PNG로 저장
  const W=720, rowH=54, headH=120, foot=40;
  const H=headH + rows.length*rowH + foot;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  // 헤더
  x.fillStyle='#0f1419'; x.font='bold 26px sans-serif';
  x.fillText('콘 작업표', 24, 40);
  x.fillStyle='#555'; x.font='15px sans-serif';
  x.fillText(`${ship} · ${today} · ${state.shipType==='container'?'컨테이너선':'일반/복합선'}`, 24, 66);
  // 열 헤더
  const cols=[ {t:'베이',x:24,w:90}, {t:'데크콘',x:130,w:190}, {t:'코끼리콘',x:330,w:190}, {t:'홀드콘',x:530,w:170} ];
  x.fillStyle='#e8a000'; x.fillRect(0,headH-34,W,34);
  x.fillStyle='#1a1206'; x.font='bold 16px sans-serif';
  cols.forEach(c=>x.fillText(c.t, c.x+8, headH-12));
  // 행
  let y=headH;
  rows.forEach((r,i)=>{
    x.fillStyle = i%2? '#f4f7fa':'#ffffff'; x.fillRect(0,y,W,rowH);
    x.fillStyle='#0f1419'; x.font='bold 22px sans-serif';
    x.fillText(r.bay+'번', 32, y+34);
    drawCell(x, r.deck, 130, y, rowH);
    drawCell(x, r.ele, 330, y, rowH);
    drawCell(x, r.hold, 530, y, rowH);
    x.strokeStyle='#dde3ea'; x.beginPath(); x.moveTo(0,y+rowH); x.lineTo(W,y+rowH); x.stroke();
    y+=rowH;
  });
  x.fillStyle='#888'; x.font='13px sans-serif';
  x.fillText('+추가  −반납  ·그대로   |  콘 작업 전 반드시 확인', 24, y+26);
  // 다운로드
  const url=cv.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=url; a.download=`콘작업표_${ship}_${today}.png`.replace(/[\\/:*?"<>|]/g,'_');
  a.click();
}
function drawCell(x,c,cx,y,rowH){
  if(c.need===0&&c.have===0){ x.fillStyle='#bbb'; x.font='20px sans-serif'; x.fillText('·',cx+8,y+34); return; }
  let col, txt;
  if(c.diff>0){col='#1a9c5b'; txt='+'+c.diff;}
  else if(c.diff<0){col='#d83a3a'; txt='−'+(-c.diff);}
  else {col='#888'; txt='0';}
  x.fillStyle=col; x.font='bold 24px sans-serif'; x.fillText(txt, cx+8, y+30);
  x.fillStyle='#999'; x.font='13px sans-serif'; x.fillText(`${c.have}→${c.need}`, cx+8, y+48);
}

// ============ 선박 설정 저장 (localStorage) ============

try{ render(); loadVoyageList(); }catch(e){
  document.getElementById('app').innerHTML='<div class="card"><p style="color:var(--rem)">초기화 오류: '+e.message+'</p></div>';
}
</script>
