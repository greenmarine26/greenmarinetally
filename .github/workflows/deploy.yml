# Restored 2026-08-06 after the 1 GB incident.
# Why: with source="Deploy from a branch", GitHub's built-in workflow has a
# FIXED 10-minute deploy timeout. After the oversized-site throttle, Pages
# backend processing exceeds 10 min, so branch-mode deploys die with
# "Timeout reached, aborting!". This workflow deploys the same repo root
# but with a 30-minute timeout. Pages source = "GitHub Actions" (set 2026-08-06).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 2026-11-24 TallyOne 5.23-02: split into build + deploy jobs (GitHub Pages starter layout).
  # Why: since 2026-11-22 deploy-pages often lists the run's artifacts ~0.3 s after upload in the
  # same job and finds 0 ("No artifacts named github-pages were found") - the artifact list is
  # eventually consistent. Runs c41cc9b, ff2d6b5, bd5032a failed this way. A separate job starts
  # after the upload job has finished, so the artifact is listed by then.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (repo root, same as branch mode)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (30 min timeout)
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 30
