<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>콘 계산기 — 평택항</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#0f1419; --panel:#1a222c; --panel2:#222d3a; --line:#324155;
    --ink:#eef4fb; --dim:#8fa3b8; --accent:#ffb020; --accent2:#39d98a;
    --add:#39d98a; --rem:#ff6b6b; --keep:#8fa3b8;
    --tap:#2d3a4a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;}
  body{padding:0 0 80px;}
  header{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,#13202e,#0f1419);
    border-bottom:1px solid var(--line); padding:14px 16px 12px;}
  header h1{margin:0; font-size:19px; letter-spacing:-.3px; font-weight:800;}
  header .sub{font-size:11px; color:var(--dim); margin-top:2px;}
  .wrap{padding:16px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;}
  .card h2{margin:0 0 12px; font-size:14px; color:var(--accent); font-weight:700;
    letter-spacing:.2px; text-transform:uppercase;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    font-weight:700; font-size:15px; padding:13px 16px; transition:.12s;}
  button:active{transform:scale(.97);}
  .btn-up{flex:1; min-width:140px; background:var(--panel2); color:var(--ink);
    border:1.5px dashed var(--line); padding:20px 12px; font-size:14px;}
  .btn-up.loaded{border-style:solid; border-color:var(--accent2); background:#16291f;}
  .voy-list{display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; margin-bottom:4px;}
  .voy-item{text-align:left; background:var(--panel2); border:1.5px solid var(--line); color:var(--ink); padding:12px 14px; width:100%;}
  .voy-item.sel{border-color:var(--accent); background:#2a2410;}
  .voy-item .vi-top{display:flex; align-items:center; gap:8px; font-size:15px;}
  .voy-item .vi-sub{font-size:12px; color:var(--dim); margin-top:3px;}
  .vtag{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px;}
  .vtag.d{background:#13344a; color:#7cc4ff;}
  .vtag.l{background:#163826; color:#5fe0a0;}
  .bv-legend{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; font-size:12px; align-items:center;}
  .bv-lg{font-weight:700; padding:3px 9px; border-radius:6px;}
  .bv-lg.d{background:#13344a; color:#7cc4ff;}
  .bv-lg.l{background:#163826; color:#5fe0a0;}
  .bv-bay{margin-bottom:18px; border-top:1px solid var(--line); padding-top:12px;}
  .bv-bayhd{font-size:15px; font-weight:800; margin-bottom:8px;}
  .bv-split{display:flex; gap:14px; align-items:flex-start;}
  .bv-col{flex:1 1 0; min-width:0; overflow-x:auto;}
  .bv-colhd{font-size:13px; font-weight:800; padding:3px 8px; border-radius:6px; margin-bottom:6px; display:inline-block;}
  .bv-colhd.d{background:#13344a; color:#7cc4ff;}
  .bv-colhd.l{background:#163826; color:#5fe0a0;}
  .bv-cnt{font-size:11px; font-weight:600; opacity:.85; margin-left:4px;}
  .bv-sec{font-size:11px; color:var(--dim); margin:6px 0 3px;}
  .bv-tab{border-collapse:separate; border-spacing:2px;}
  .bv-tab td{width:18px; height:18px; text-align:center; font-size:11px; border-radius:3px; line-height:18px;}
  .bv-tab.box td{width:auto; height:auto;}
  .bv-rl{color:var(--dim); font-size:10px; font-weight:600;}
  .bv-tl{color:var(--dim); font-size:10px; font-weight:600; min-width:16px;}
  .bv-slot{border:1px dashed #2c3a4d; background:transparent; min-width:46px; height:34px;}
  .bv-slot.off{border-color:#232f3e;}
  .bv-empty{background:transparent;}
  /* 컨테이너 박스 셀 */
  .bvc{min-width:56px; height:36px; border-radius:3px; padding:2px 4px; vertical-align:top; border:1px solid rgba(255,255,255,.12);}
  .bvc-in{font-size:8.5px; line-height:1.2; font-family:Consolas,monospace; text-align:left;}
  .bvc-pp{font-weight:700; white-space:nowrap; overflow:hidden;}
  .bvc-cn{font-weight:800; font-size:9px; letter-spacing:-.3px; white-space:nowrap; overflow:hidden;}
  .bvc-l3{font-size:8px; opacity:.9; white-space:nowrap; overflow:hidden;}
  .bvc-star{color:#ffd23f; margin-left:1px;}
  /* 평택분 (양하/선적) */
  .bvc.ptk-d{background:#1d4a66; color:#bfe3ff; border-color:#3a7ca5;}
  .bvc.ptk-l{background:#1c4a32; color:#bff0d0; border-color:#3a9d63;}
  /* 통과/타항 (흐리게) */
  .bvc.oth-d{background:#16242f; color:#6f93a8;}
  .bvc.oth-l{background:#162a1f; color:#6fa886;}
  /* 특수화물 */
  .bvc.sp-rf{background:#0e4d52; color:#7fffe0; border-color:#22b8c4;}
  .bvc.sp-dg{background:#5a1717; color:#ffb3b3; border-color:#e05656;}
  .bvc.sp-fr{background:#3a1f5a; color:#d9b3ff; border-color:#9b59d0;}
  .bvc.sp-tk{background:#5a3410; color:#ffcf9f; border-color:#d08a30;}
  .bvc.sp-ot{background:#4a1f4a; color:#f0b3f0; border-color:#c050c0;}
  .bv-lg.ptkd{background:#1d4a66; color:#bfe3ff;}
  .bv-lg.ptkl{background:#1c4a32; color:#bff0d0;}
  .bv-lg.rf{background:#0e4d52; color:#7fffe0;}
  .bv-lg.dg{background:#5a1717; color:#ffb3b3;}
  .bv-c{font-weight:700;}
  .bv-c.d{background:#13344a; color:#7cc4ff;}
  .bv-c.l{background:#163826; color:#5fe0a0;}
  .btn-up .ic{font-size:26px; display:block; margin-bottom:6px;}
  .btn-up .st{font-size:11px; color:var(--dim); margin-top:5px; font-weight:500;}
  .btn-primary{background:var(--accent); color:#1a1206; width:100%; padding:16px; font-size:16px;}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .seg{display:flex; background:var(--panel2); border-radius:10px; padding:3px; gap:3px;}
  .seg button{flex:1; background:transparent; color:var(--dim); padding:10px; font-size:13px;}
  .seg button.on{background:var(--accent); color:#1a1206;}
  input[type=file]{display:none;}
  label.fl{font-size:12px; color:var(--dim); display:block; margin-bottom:6px;}
  .ship-name{width:100%; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:12px; color:var(--ink); font-size:15px; font-family:inherit;}
  .hidden{display:none !important;}
  .hint{font-size:12px; color:var(--dim); line-height:1.5; margin-top:8px;}
  canvas{max-width:100%; border-radius:8px; border:1px solid var(--line);}
  .confirm-bar{background:#2a2410; border:1px solid var(--accent); border-radius:12px;
    padding:14px; margin-bottom:14px;}
  .confirm-bar p{margin:0 0 10px; font-size:14px;}
  /* result table */
  .bay-result{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px;}
  .bay-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;
    border-bottom:1px solid var(--line); padding-bottom:10px;}
  .bay-head .num{font-size:22px; font-weight:800; letter-spacing:-.5px;}
  .bay-head .tag{font-size:11px; color:var(--dim);}
  .cone-line{display:flex; align-items:center; gap:12px; padding:9px 0;}
  .cone-line .nm{width:74px; font-size:13px; font-weight:700; color:var(--dim);}
  .cone-line .body{flex:1; font-size:15px;}
  .cone-line .act{font-size:15px; font-weight:800; white-space:nowrap;}
  .act.add{color:var(--add);} .act.rem{color:var(--rem);} .act.keep{color:var(--keep);}
  .nums{font-size:13px; color:var(--dim);}
  .nums b{color:var(--ink); font-weight:700;}
  .empty-note{color:var(--dim); font-size:13px; text-align:center; padding:30px 0;}
  .total-card{background:linear-gradient(135deg,#1c2937,#16202c); border:1px solid var(--accent);}
  .editor-cell{display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:26px; border:1px solid var(--line); margin:1px; border-radius:4px;
    font-size:13px; font-weight:700; background:var(--panel2);}
  .footer-note{font-size:11px; color:var(--dim); text-align:center; padding:20px 16px; line-height:1.6;}
  .badge{display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px;
    background:var(--panel2); color:var(--dim); margin-left:6px;}
  .loading{text-align:center; padding:40px 0; color:var(--accent);}
  .spinner{width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 14px;}

  /* 결과 표 */
  .share-head{margin-bottom:12px;}
  .sh-title{font-size:20px; font-weight:800;}
  .sh-sub{font-size:12px; color:var(--dim); margin-top:3px;}
  .ctab{width:100%; border-collapse:collapse; font-size:15px;}
  .ctab th{background:var(--accent); color:#1a1206; padding:8px 4px; font-size:12px; font-weight:800; text-align:center; border:1px solid var(--line);}
  .ctab th small{font-weight:500; font-size:9px; opacity:.8;}
  .ctab td{border:1px solid var(--line); text-align:center; padding:7px 4px; vertical-align:middle;}
  .ctab .bay-c{font-size:19px; font-weight:800; background:var(--panel2);}
  .ctab .big{display:block; font-size:21px; font-weight:800; line-height:1.1;}
  .ctab .sub{display:block; font-size:10px; color:var(--dim);}
  .ctab .add-c .big{color:var(--add);}
  .ctab .rem-c .big{color:var(--rem);}
  .ctab .keep-c{color:var(--dim);} .ctab .keep-c .big{color:var(--dim);}
  .legend{margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; font-size:11px;}
  .lg{color:var(--dim);} .lg.add{color:var(--add);} .lg.rem{color:var(--rem);}
  .btn-share{flex:1; min-width:130px; background:var(--panel2); color:var(--ink); border:1px solid var(--line); padding:14px;}
  .btn-share:active{background:var(--accent); color:#1a1206;}

  .steps{list-style:none; padding:0; margin:0;}
  .steps li{padding:8px 0 8px 30px; position:relative; font-size:14px; color:var(--dim); border-bottom:1px solid var(--line);}
  .steps li:last-child{border-bottom:none;}
  .steps li small{font-size:11px; opacity:.7;}
  .steps li.done{color:var(--add);}
  .steps li.now{color:var(--ink); font-weight:700;}
  .steps li.done::before{content:'✓'; position:absolute; left:6px; color:var(--add); font-weight:800;}
  .steps li.now::before{content:'▶'; position:absolute; left:6px; color:var(--accent); font-size:11px; top:11px;}
  .ship-line{display:flex; align-items:center; gap:12px; padding:7px 0; font-size:15px;}
  .ship-line .sk{width:54px; color:var(--dim); font-size:13px;}
  .mini{margin-left:auto; background:var(--panel2); color:var(--dim); border:1px solid var(--line); padding:5px 12px; font-size:12px; border-radius:8px;}
  .ask-type{margin-top:12px; background:#2a2410; border:1px solid var(--accent); border-radius:10px; padding:12px;}
  .ask-type p{margin:0 0 10px; font-size:14px;}
  .ask-type p small{color:var(--dim); font-size:11px;}
  .ask-type .seg button{padding:12px 8px; font-size:14px;}
  .ask-type .seg button small{font-size:10px; font-weight:500; opacity:.8;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <h1>콘 계산기 <span class="badge">평택항 · 무료배포</span></h1>
  <div class="sub">양하·선적 플랜으로 고정장치 콘 자동 계산</div>
</header>
<div class="wrap" id="app"></div>
<div class="footer-note">
  무료 배포 · 오프라인 작동 · 비용 없음<br>
  자동 인식 후 반드시 확인하세요. 콘 작업은 정확도가 생명입니다.
</div>
<script>
// ============ 콘 계산 엔진 (검증됨) ============
const ROWS=['10','08','06','04','02','01','03','05','07','09'];

function calcCones(deck, hold, shipType){
  const hold40 = shipType==='container' ? 0 : 4;
  let dk=0, el=0, hd=0;
  const occ=(g,t,r)=> g[t] && g[t][r] && g[t][r]!=='.';
  function area(g,isDeck){
    const tiers=Object.keys(g).map(Number).sort((a,b)=>a-b);
    if(!tiers.length) return;
    const low=tiers[0];
    for(const t of tiers){
      if(t===low) continue;
      for(const r in g[t]){
        const sz=g[t][r];
        if(sz!=='O40'&&sz!=='O20') continue;
        if(!occ(g,t-2,r)) continue;
        if(isDeck){ if(sz==='O40') dk+=4; else {dk+=2; el+=2;} }
        else { if(sz==='O40') hd+=hold40; else hd+=1; }
      }
    }
  }
  area(deck,true); area(hold,false);
  return {deck:dk, ele:el, hold:hd};
}

// 베이 합본: 7-8-9 => key 8. label "BAY (08) 09" or "BAY 07"
function bayGroupKey(label){
  const nums=(label.match(/\d+/g)||[]).map(Number);
  if(!nums.length) return label;
  // 짝수가 있으면 짝수, 없으면 홀수를 짝수로 내림(7->? ) : 7,8,9 묶음의 대표 = 가운데 짝수
  const even=nums.find(n=>n%2===0);
  if(even!==undefined) return even;
  // 홀수만(예: BAY 07) => 짝꿍 짝수 = 홀수-1 or +1? 표기상 07은 (08)09와 한묶음 → 8
  const odd=nums[0];
  return odd+1; // 07->8, 23->24
}

// 배분: 데크콘÷4, 코끼리콘÷2, 홀드콘 트윈합본×2
function distribute(cones){
  return {
    deckPer: Math.round(cones.deck/4),
    elePer: Math.round(cones.ele/2),
    holdTotal: cones.hold*2
  };
}
// ============ EDI(BAPLIE) 파서 — 앱 통합용 ============
function isEDI(text){
  return /UNB\+|LOC\+147\+/.test(text) && /EQD\+/.test(text);
}

function parseEDI(text){
  // 평택 기준: 선적=POL KRPTK, 양하=POD KRPTK. 둘 다 시도해 더 많은 쪽 채택.
  const segs=text.split("LOC+147+");
  const rowsAll=[];
  for(let i=1;i<segs.length;i++){
    const s=segs[i];
    const pm=s.match(/^(\d{7})/);
    if(!pm) continue;
    const pos=pm[1];
    const bay=pos.slice(0,3), row=pos.slice(3,5), tier=parseInt(pos.slice(5,7));
    // ISO + 컨번호: EQD+CN+{컨번호}+{ISO}:... 형태
    let iso='', cn='';
    const eqd=s.match(/EQD\+CN\+[^']*/);
    if(eqd){
      const parts=eqd[0].split('+');           // ['EQD','CN',컨번호,'45G1:102:5',...]
      cn=((parts[2]||'').split(':')[0]||'').toUpperCase().trim();
      iso=((parts[3]||'').split(':')[0]||'').toUpperCase();
    }
    const size=(iso&&iso[0]==='2')?'20':'40';
    // POL/POD: 코드만(영숫자)
    const polm=s.match(/LOC\+9\+([A-Za-z0-9]+)/), podm=s.match(/LOC\+11\+([A-Za-z0-9]+)/);
    // F/E 상태: EQD ... 뒤 status, 또는 FTX. BAPLIE는 보통 MEA/EQD 뒤. 간이: 'EMPTY'/'5'(full)/'4'(empty) 추정
    //   EDI status code: 5=Full, 4=Empty (검수앱 역매핑). 세그먼트에 :5 / :4 형태로.
    let fe='';
    const fem=s.match(/EQD\+CN\+[^']*\+[A-Z0-9]*\+*([45])(?=[+':])/);
    // 더 안전: MEA(무게)있으면 Full 경향, 아니면 미정. 우선 status 직접 탐색.
    if(/\bEMPTY\b/i.test(s)) fe='E';
    // 온도(리퍼): TMP+2+{온도}:CEL
    let temp=null;
    const tm=s.match(/TMP\+2\+(-?\d+(?:\.\d+)?)/);
    if(tm) temp=tm[1];
    // 특수타입: ISO 기반
    const isReefer=/^R[FE]/.test(iso)||/^[24]58[2-5]$/.test(iso)||/^[24][024568L9]R/.test(iso)||temp!=null;
    const dg=/IMD\+|DGS\+/.test(s);
    const t3=iso.slice(2);
    const fr=/^4[0-9]?P/.test(iso)||/PF|PL|PC/.test(t3)||/^[24][0-9]P/.test(iso);  // 플랫랙/플랫폼
    const ot=/^[24][0-9]U/.test(iso)||/^[24][0-9]T/.test(iso)&&false;             // 오픈탑
    rowsAll.push({bay,row,tier,size,cn,iso,fe,temp,
      reefer:isReefer,dg,fr,ot,
      pol:polm?polm[1]:null,pod:podm?podm[1]:null});
  }
  // 제목/POL·POD로 선적/양하 판별
  const up=text.toUpperCase();
  let kind=null, rows;
  const polPtk=rowsAll.filter(r=>r.pol==='KRPTK');
  const podPtk=rowsAll.filter(r=>r.pod==='KRPTK');
  if(up.includes('LOAD')||polPtk.length>podPtk.length){ kind='stow'; rows=polPtk.length?polPtk:rowsAll; }
  else { kind='disch'; rows=podPtk.length?podPtk:rowsAll; }
  let vessel='';
  const tdt=text.match(/TDT\+[\s\S]*?(?=['~\n\r]|$)/);
  if(tdt){
    const parts=tdt[0].split(':');
    const last=(parts[parts.length-1]||'').trim();
    if(/[A-Za-z]/.test(last) && last.length>=3) vessel=last;
  }
  return {rows, kind, isEDI:true, vessel};
}

// ============ ASC 파서 (검수앱 parseAscFile 위치 추출분) ============
// 검수앱은 ASC도 EDI와 같은 raw/edi 경로에 보관한다. ASC도 EDI를 대체할 수 있게 처리.
// 판별: .asc 확장자 또는 첫 줄이 $604로 시작.
function isASC(text){
  if(!text) return false;
  const head=text.slice(0,200);
  return /^\$604/.test(head.trimStart()) || /\n\$604/.test(head);
}
// 검수앱 normalizeBay: 정수화 ("01"→"1"). 콘앱 EDI는 bay 3자리지만 ediToBayGroups가
// parseInt로 처리하므로 자리수 무관. ASC도 동일 형식 객체 반환.
function parseASC(text){
  const lines=text.split(/\r?\n/);
  const rowsAll=[];
  let vessel='';
  for(const ln of lines){
    if(ln.startsWith('$604')){
      const parts=ln.substring(4).split('/');
      if(parts.length>=3) vessel=(parts[1]||'').trim();
      break;
    }
  }
  for(const line of lines){
    if(line.length<50) continue;
    if(line.startsWith('$')) continue;
    if(line.trimStart().startsWith('***')) continue;
    const slot=line.substring(0,6).trim();
    if(!/^\d{6}$/.test(slot)) continue;
    const cn=line.substring(7,18).replace(/[\s\-]/g,'').toUpperCase();
    const hasCn=/^[A-Z]{4}\d{7}$/.test(cn);
    if(cn && !hasCn) continue;
    const bayN=parseInt(slot.substring(0,2),10);
    const bay=isNaN(bayN)?'':String(bayN);
    const row=slot.substring(2,4);
    const tier=parseInt(slot.substring(4,6),10);
    // BAY 00 메타 라인 차단 (cn 없고 bay='0')
    if(!cn && bay==='0') continue;
    // ISO/size: typeBlock(44~54)에서 앞 코드. 검수앱 규칙 간략 적용.
    const typeBlock=line.substring(44,54).trim();
    let size='40';
    // 20ft 판별: 코드에 '20' 또는 ISO 숫자형 앞자리 '2'
    const m1=typeBlock.match(/^([A-Z]{2})(\d{2})/);      // DC20, HC40, RF20 ...
    const m2=typeBlock.match(/^(\d{2})[A-Z]/);            // 22GP, 45GP ...
    if(m1){ size = m1[2]==='20' ? '20' : '40'; }
    else if(m2){ size = m2[1][0]==='2' ? '20' : '40'; }
    // POL/POD: 끝 10자(POL5+POD5) 우선
    const tail=line.replace(/\u0000/g,'').trim();
    let pol=null, pod=null;
    const pp=tail.match(/([A-Z]{5})([A-Z]{5})$/);
    if(pp){ pol=pp[1]; pod=pp[2]; }
    rowsAll.push({bay,row,tier,size,pol,pod});
  }
  const polPtk=rowsAll.filter(r=>r.pol==='KRPTK');
  const podPtk=rowsAll.filter(r=>r.pod==='KRPTK');
  let kind, rows;
  if(polPtk.length>podPtk.length){ kind='stow'; rows=polPtk.length?polPtk:rowsAll; }
  else { kind='disch'; rows=podPtk.length?podPtk:rowsAll; }
  return {rows, kind, isEDI:true, vessel};  // isEDI:true = 위치 rows 보유(다운스트림 동일 처리)
}

// EDI/ASC 자동 판별 통합 파서. raw 텍스트가 둘 중 무엇이든 위치 rows를 반환.
function parsePositions(text){
  if(isASC(text)) return parseASC(text);
  if(isEDI(text)) return parseEDI(text);
  return null;
}

// EDI rows → deck/hold tiers (콘엔진 입력). 베이그룹 합본은 결과 단계에서.
function ediToBayGroups(rows, shipType){
  const h40 = shipType==='container'?0:4;
  const filled=new Set(rows.map(r=>r.bay+'_'+r.row+'_'+r.tier));
  const groups={};
  for(const r of rows){
    const bay=parseInt(r.bay), tier=r.tier;
    const isDeck=tier>=80;
    if(!filled.has(r.bay+'_'+r.row+'_'+(tier-2))) continue; // 받침/최저단
    const gk = bay%2===0 ? bay : bay+1;
    if(!groups[gk]) groups[gk]={deck:0,ele:0,hold:0};
    if(isDeck){ if(r.size==='40') groups[gk].deck+=4; else {groups[gk].deck+=2; groups[gk].ele+=2;} }
    else { if(r.size==='40') groups[gk].hold+=h40; else groups[gk].hold+=1; }
  }
  return groups;
}

// ============ 검수앱 Firebase 연동 (읽기 전용, REST) ============
// 검수앱(Tallyman Master)이 voyages/{key}/{mode}/raw/edi 에 보관한 EDI 원문을 직접 읽어온다.
//   mode: discharge=양하, loading=선적
const FB_BASE='https://greenmarinetally-default-rtdb.asia-southeast1.firebasedatabase.app';

// 항차 목록 (raw EDI가 있는 항차만) 가져오기
async function fbFetchVoyages(){
  // 각 항차에 양하/선적 자료(raw EDI 또는 파싱된 ediContainers)가 있는지 판정.
  //   기존 항차는 raw가 없고 ediContainers만 있을 수 있음 → 둘 중 하나라도 있으면 포함(재업로드 불필요).
  const res=await fetch(`${FB_BASE}/voyages.json?shallow=false`);
  if(!res.ok) throw new Error('Firebase 응답 오류 ('+res.status+')');
  const all=await res.json();
  if(!all) return [];
  const out=[];
  const has=(sec)=>{
    if(!sec) return false;
    if(sec.raw && sec.raw.edi && sec.raw.edi.text) return true;
    if(sec.ediContainers && Object.keys(sec.ediContainers).length>0) return true;
    return false;
  };
  for(const key in all){
    const v=all[key]||{};
    const info=v.info||{};
    const hasD=has(v.discharge);
    const hasL=has(v.loading);
    if(!hasD&&!hasL) continue;
    out.push({
      key,
      vsl: info.vsl||key.split('_')[0]||'(선박명 미상)',
      imo: info.imo||'',
      voy: info.voy_l||info.voy_d||info.voy||'',
      voy_d: info.voy_d||'', voy_l: info.voy_l||'',
      hasD, hasL,
      createdAt: info.createdAt||0,
    });
  }
  out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); // 최신 항차 먼저
  return out;
}

// 항차 mode의 ediContainers(이미 파싱된 좌표)를 콘앱 rows 형식으로 가져오기.
//   검수앱이 저장한 그대로 → 재업로드 불필요, 검수앱과 동일 데이터. 없으면 null(→raw 폴백).
async function fbFetchEdiContainers(voyageKey, mode){
  const res=await fetch(`${FB_BASE}/voyages/${encodeURIComponent(voyageKey)}/${mode}/ediContainers.json`);
  if(!res.ok) return null;
  const obj=await res.json();
  if(!obj || typeof obj!=='object') return null;
  const rows=[];
  for(const k in obj){
    const c=obj[k]||{};
    if(c.bay==null || c.tier==null) continue;
    const iso=String(c.iso||c.tp||'');
    const size = c.size ? String(c.size) : (iso && iso[0]==='2' ? '20' : '40');
    const isReefer = !!c.rf || /^R[FE]/.test(iso) || /^[24]58[2-5]$/.test(iso) || /^[24][024568L9]R/.test(iso);
    rows.push({
      bay:String(c.bay), row:String(c.row||'').padStart(2,'0'),
      tier:String(c.tier).padStart(2,'0'), size,
      cn:String(c.cn||'').toUpperCase(), iso,
      fe:c.fe||'', op:c.op||'', wt:c.wt||0,
      temp:(c.temp!=null?c.temp:(c.setpoint!=null?c.setpoint:null)),
      reefer:isReefer, dg:!!c.dg, fr:!!c.fr, tk:!!c.tk, ot:!!(c.ot||c.oog), oog:!!c.oog,
      pol:c.pol||null, pod:c.pod||null,
    });
  }
  return rows.length? rows : null;
}


// 특정 항차의 mode별 raw EDI 텍스트 가져오기
async function fbFetchRawEdi(voyageKey, mode){

//   이게 있으면 검수앱과 동일한 카고플랜을 그릴 수 있다.
let _fbBayDict = null;

// 검수앱 fuzzyLookupAcrossDicts의 Firebase 매칭부 포팅 (code/imo/name/callsign).
//   콘앱은 임베드 사전(v2/v5) 없이 Firebase v3만 본다. 없으면 null(→좌표 역산 폴백).
function lookupBayDef(fbDict, imo, nameOrCode){
  if(!fbDict || Object.keys(fbDict).length===0) return null;
  const search = String(nameOrCode||'').toUpperCase().replace(/\s+/g,'');
  // 1) code 정확
  if(search && fbDict[search] && fbDict[search].bayDef) return fbDict[search];
  // 2) IMO
  if(imo){
    const e = Object.values(fbDict).find(e=>e && e.imo===imo && e.bayDef);
    if(e) return e;
  }
  // 3) name fuzzy (5글자 prefix)
  if(search && search.length>=4){
    const e = Object.values(fbDict).find(e=>{
      if(!e || !e.bayDef) return false;
      const en = String(e.name||'').toUpperCase().replace(/\s+/g,'');
      return en && (en.includes(search.slice(0,5)) || search.includes(en.slice(0,5)));
    });
    if(e) return e;
  }
  // 4) callsign
  if(search && search.length>=4){
    const e = Object.values(fbDict).find(e=>{
      if(!e || !e.bayDef) return false;
      const ec = String(e.callsign||'').toUpperCase();
      return ec && ec.length>=4 && (ec.startsWith(search) || search.startsWith(ec));
    });
    if(e) return e;
  }
  return null;
}

// 항차 선택 → 양하/선적 raw EDI를 받아 기존 parseEDI로 처리
async function selectVoyage(voyageKey){
  const v=(state.voyages||[]).find(x=>x.key===voyageKey);
  if(!v) return;
  state.voyageKey=voyageKey;
  state.stow=null; state.disch=null; state.shipType=null; state.shipName=''; state.detected=false;
  showLoading('검수앱에서 '+v.vsl+' 자료 불러오는 중...');
  try{
    if(v.hasD){
      // 1순위: 이미 파싱된 ediContainers (검수앱과 동일, 재업로드 불필요)
      let rows=await fbFetchEdiContainers(voyageKey,'discharge');
      if(rows){ state.disch={ediRows:rows, isEDI:true, fname:'검수앱(양하)', vessel:v.vsl}; }
      else {  // 2순위: raw EDI/ASC 파싱 폴백
        const txt=await fbFetchRawEdi(voyageKey,'discharge');
        const d=txt&&parsePositions(txt);
        if(d){ state.disch={ediRows:d.rows, isEDI:true, fname:'검수앱(양하)', vessel:d.vessel}; applyVessel(d.vessel); }
      }
    }
    if(v.hasL){
      let rows=await fbFetchEdiContainers(voyageKey,'loading');
      if(rows){ state.stow={ediRows:rows, isEDI:true, fname:'검수앱(선적)', vessel:v.vsl}; }
      else {
        const txt=await fbFetchRawEdi(voyageKey,'loading');
        const d=txt&&parsePositions(txt);
        if(d){ state.stow={ediRows:d.rows, isEDI:true, fname:'검수앱(선적)', vessel:d.vessel}; applyVessel(d.vessel); }
      }
    }
    if(!state.shipName) state.shipName=v.vsl;
    applyVessel(state.shipName);
    render();
  }catch(e){
    state.voyErr='자료를 불러오지 못했습니다: '+e.message; render();
  }
}

async function readPDF(file){
  if(!PDF_OK) throw new Error('PDF 기능을 쓰려면 인터넷 연결이 필요합니다. EDI나 사진을 사용하거나, 인터넷 연결 후 다시 열어주세요.');
  showLoading('PDF 여는 중...');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  showLoading('PDF 그리는 중...');
  const scale=180/72;
  const vp=page.getViewport({scale});
  const cv=document.createElement('canvas');
  cv.width=vp.width; cv.height=vp.height;
  const ctx=cv.getContext('2d');
  await page.render({canvasContext:ctx, viewport:vp}).promise;
  const txt=await page.getTextContent();
  // 제목으로 선적/양하 판별
  const allText=txt.items.map(i=>i.str).join(' ').toUpperCase();
  const kind = allText.includes('DISCHARG') ? 'disch'
             : allText.includes('STOW') ? 'stow' : null;
  // 베이 위치 + 라벨
  const bays=[];
  txt.items.forEach((it,idx)=>{
    if(it.str.trim()==='BAY'){
      const x=it.transform[4]*scale, y=(vp.height/scale - it.transform[5])*scale;
      // 같은 줄 오른쪽 토큰 모으기
      let lbl='BAY';
      for(let j=idx+1;j<txt.items.length;j++){
        const t=txt.items[j];
        const tx=t.transform[4]*scale, ty=(vp.height/scale-t.transform[5])*scale;
        if(Math.abs(ty-y)<8 && tx>x && tx<x+150){ lbl+=' '+t.str.trim(); }
      }
      bays.push({x,y,label:lbl.replace(/\s+/g,' ').trim()});
    }
  });
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  // 선박명: 제목 다음 큰 텍스트. "DONGJIN CONTINENTAL" 등. VOY 앞 토큰들 추정
  let vessel='';
  const tline=txt.items.map(i=>i.str).join(' ');
  const vm=tline.match(/(?:INSTRUCTION|PLAN)\s+([A-Z][A-Z ]{3,30}?)\s+VOY/i);
  if(vm) vessel=vm[1].trim();
  return {canvas:cv, ctx, img, bays, kind, w:cv.width, h:cv.height, vessel};
}

async function readImage(file){
  // 사진: 캔버스에 그려서 같은 픽셀 분석 (텍스트/베이 라벨 없음 → 격자만)
  const url=URL.createObjectURL(file);
  const im=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
  const cv=document.createElement('canvas');
  const maxW=1600; const sc=Math.min(1,maxW/im.width);
  cv.width=im.width*sc; cv.height=im.height*sc;
  const ctx=cv.getContext('2d');
  ctx.drawImage(im,0,0,cv.width,cv.height);
  URL.revokeObjectURL(url);
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  return {canvas:cv, ctx, img, bays:[], kind:null, w:cv.width, h:cv.height, isPhoto:true};
}

// 색 무관 그레이스케일 판정
function gray(img,x,y){
  const i=(y*img.width+x)*4;
  return (img.data[i]+img.data[i+1]+img.data[i+2])/3;
}
// ============ 셀 격자 검출 (검은선 둘러싸인 사각형) ============
function findCells(img){
  const W=img.width,H=img.height;
  const N=W*H;
  const dark=new Uint8Array(N);
  for(let i=0,p=0;p<N;p++){ const r=img.data[p*4],g=img.data[p*4+1],b=img.data[p*4+2];
    dark[p]= ((r+g+b)/3)<140 ? 0:1; } // 1=밝음, 0=선
  const seen=new Uint8Array(N);
  const cells=[];
  const stack=new Int32Array(40000); // 고정 버퍼
  for(let p=0;p<N;p++){
    if(dark[p]!==1 || seen[p]) continue;
    let sp=0; stack[sp++]=p; seen[p]=1;
    let minx=p%W,maxx=minx,miny=(p/W)|0,maxy=miny,cnt=0;
    while(sp>0){
      const q=stack[--sp]; cnt++;
      const qx=q%W, qy=(q/W)|0;
      if(qx<minx)minx=qx; if(qx>maxx)maxx=qx; if(qy<miny)miny=qy; if(qy>maxy)maxy=qy;
      // 4방향
      let n;
      n=q-1; if(qx>0   && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
      n=q+1; if(qx<W-1 && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
      n=q-W; if(qy>0   && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
      n=q+W; if(qy<H-1 && dark[n]===1 && !seen[n] && sp<39996){seen[n]=1; stack[sp++]=n;}
    }
    const w=maxx-minx, h=maxy-miny;
    if(cnt>=300 && cnt<3000 && w>=26&&w<=64 && h>=14&&h<=38){
      cells.push({x0:minx,y0:miny,x1:maxx,y1:maxy});
    }
  }
  return cells;
}

// 셀 상태: 빈칸 / 채움(사선=20, 무사선=40). 우리화물 여부는 플랜파일로 구분.
function cellState(img,c){
  const pad=3;
  let darkN=0, tot=0;
  const xs=c.x0+pad, xe=c.x1-pad, ys=c.y0+pad, ye=c.y1-pad;
  for(let y=ys;y<ye;y++)for(let x=xs;x<xe;x++){ tot++; if(gray(img,x,y)<130) darkN++; }
  if(tot===0||darkN/tot<0.03) return '.';
  // 사선: anti-diagonal 코너(bottom-left + top-right)
  const w=xe-xs,h=ye-ys; let bl=0,tr=0;
  for(let y=ys;y<ye;y++)for(let x=xs;x<xe;x++){
    if(gray(img,x,y)>=130) continue;
    const yn=(y-ys)/h, xn=(x-xs)/w;
    if(yn>0.55&&xn<0.45) bl++;
    if(yn<0.45&&xn>0.55) tr++;
  }
  const slash = bl>4 && tr>4;
  return slash?'F20':'F40';
}

// 베이별 셀 묶기 + 티어/로우 격자 정렬
function buildBay(img,cells,bay){
  const bx=bay.x;
  const near=cells.filter(c=>{
    const cx=(c.x0+c.x1)/2, cy=(c.y0+c.y1)/2;
    return cx>bx-70 && cx<bx+360 && cy>bay.y+10 && cy<bay.y+340;
  });
  if(!near.length) return null;
  // 티어밴드: cy 클러스터
  const cys=near.map(c=>(c.y0+c.y1)/2).sort((a,b)=>a-b);
  const bands=[]; let grp=[cys[0]];
  for(let i=1;i<cys.length;i++){ if(cys[i]-grp[grp.length-1]>14){bands.push(avg(grp)); grp=[cys[i]];} else grp.push(cys[i]); }
  bands.push(avg(grp));
  // 로우: cx 클러스터
  const cxs=near.map(c=>(c.x0+c.x1)/2).sort((a,b)=>a-b);
  const cols=[]; grp=[cxs[0]];
  for(let i=1;i<cxs.length;i++){ if(cxs[i]-grp[grp.length-1]>20){cols.push(avg(grp)); grp=[cxs[i]];} else grp.push(cxs[i]); }
  cols.push(avg(grp));
  // 해치커버 갭으로 deck/hold 분리
  let split=0,maxgap=0;
  for(let i=0;i<bands.length-1;i++){ const g=bands[i+1]-bands[i]; if(g>maxgap){maxgap=g; split=i;} }
  // 셀을 (band,col) 매핑
  const grid={};
  for(const c of near){
    const cx=(c.x0+c.x1)/2, cy=(c.y0+c.y1)/2;
    let ti=0,bd=1e9; bands.forEach((b,i)=>{if(Math.abs(b-cy)<bd){bd=Math.abs(b-cy);ti=i;}});
    let ci=0,cd=1e9; cols.forEach((cc,i)=>{if(Math.abs(cc-cx)<cd){cd=Math.abs(cc-cx);ci=i;}});
    grid[ti+'_'+ci]={state:cellState(img,c), band:ti, col:ci, cell:c};
  }
  return {grid, bands, cols, split, label:bay.label};
}
function avg(a){return a.reduce((s,v)=>s+v,0)/a.length;}
// ============ 그리드 → 콘엔진 입력(deck/hold tiers) ============
function gridToTiers(bayObj){
  // band 0=맨위 티어. split이하=deck, 초과=hold. 티어번호는 deck: 위에서부터 ...88,86,84,82 / hold 위 08,06,04,02
  // 콘엔진은 tier 숫자 클수록 위. 받침은 t-2. 여기선 band index를 티어로 환산.
  const odd = (bayObj.label.match(/\d+/g)||[]).length===1 && parseInt((bayObj.label.match(/\d+/)||[0])[0])%2===1;
  const deck={}, hold={};
  const nBands=bayObj.bands.length;
  for(const k in bayObj.grid){
    const g=bayObj.grid[k];
    if(g.state==='.') continue;
    const isDeck = g.band<=bayObj.split;
    // 티어 숫자: 아래일수록 작게. deck 영역 band가 클수록(아래) 티어 작게.
    // deck band range: 0..split  -> 티어 = (split-band)*2 + 82  (최저=82)
    // hold band range: split+1..nBands-1 -> 티어 = (nBands-1-band)*2 + 2
    let tier, sz;
    if(isDeck){ tier = (bayObj.split - g.band)*2 + 82; }
    else { tier = (nBands-1 - g.band)*2 + 2; }
    // 사이즈: 홀수베이는 채움이면 무조건 20ft. X(우리화물아님)은 받침으로만 쓰되 콘계산 제외.
    if(g.state==='F20') sz='O20';
    else sz = odd ? 'O20' : 'O40';
    const tgt=isDeck?deck:hold;
    if(!tgt[tier]) tgt[tier]={};
    tgt[tier][k.split('_')[1]]=sz; // col index as row key (받침 비교용으로 일관)
  }
  return {deck,hold};
}

// 전체 플랜 → 베이별 콘
function analyzePlan(plan,shipType){
  if(!plan || !plan.bays.length) return {};
  const cells=findCells(plan.img);
  const res={};
  for(const bay of plan.bays){
    const bo=buildBay(plan.img,cells,bay);
    if(!bo) continue;
    const {deck,hold}=gridToTiers(bo);
    const cones=calcCones(deck,hold,shipType);
    res[bay.label]={cones, bayObj:bo, group:bayGroupKey(bay.label)};
  }
  return res;
}

// 선적-양하 차감 → 베이그룹별 결과
function computeResult(stowRes, dischRes){
  const groups={};
  function add(res,which){
    for(const lbl in res){
      const gk=res[lbl].group;
      if(!groups[gk]) groups[gk]={stow:{deck:0,ele:0,hold:0}, disch:{deck:0,ele:0,hold:0}, labels:[]};
      const c=res[lbl].cones;
      groups[gk][which].deck+=c.deck; groups[gk][which].ele+=c.ele; groups[gk][which].hold+=c.hold;
      if(!groups[gk].labels.includes(lbl)) groups[gk].labels.push(lbl);
    }
  }
  add(stowRes,'stow'); add(dischRes,'disch');
  return groups;
}

// 카고플랜 표시 (양하/선적 각각, 검수앱과 동일 골격)
async function handleFile(file,slot){
  if(!file) return;
  const name=(file.name||'').toLowerCase();
  showLoading('읽는 중... ('+(file.name||'파일')+')');
  try{
    const isPdf = file.type==='application/pdf' || name.endsWith('.pdf');
    const isImg = (file.type||'').startsWith('image/') || /\.(jpe?g|png|gif|webp|heic)$/.test(name);

    // PDF
    if(isPdf){
      const data=await readPDF(file);
      if(data.kind && data.kind!==slot) slot=data.kind;
      state[slot]=data; applyVessel(data.vessel); render(); return;
    }
    // 이미지
    if(isImg){
      const data=await readImage(file);
      state[slot]=data; render(); return;
    }
    // 그 외 전부 텍스트로 읽어 EDI인지 내용으로 판별 (확장자 무관)
    const text=await file.text();
    if(isEDI(text)){
      const d=parseEDI(text);
      if(d.kind && d.kind!==slot) slot=d.kind;
      state[slot]={ediRows:d.rows, isEDI:true, fname:file.name, vessel:d.vessel};
      applyVessel(d.vessel); render(); return;
    }
    // 텍스트인데 EDI 아님
    showErr(slot, '이 파일은 EDI 형식이 아닙니다. EDI(BAPLIE) 또는 PDF·사진을 올려주세요. (읽은 파일: '+(file.name||'?')+')');
  }catch(err){
    showErr(slot, '파일을 읽지 못했습니다: '+err.message+' (파일: '+(file.name||'?')+')');
  }
}
function showErr(slot,msg){
  const ra=document.getElementById('resultArea');
  if(ra) ra.innerHTML='<div class="card"><p style="color:var(--rem);font-size:14px;line-height:1.6">⚠ '+msg+'</p></div>';
}
function showLoading(msg){
  const ra=document.getElementById('resultArea');
  if(ra) ra.innerHTML=`<div class="card"><div class="loading"><div class="spinner"></div>${msg}</div></div>`;
}

function planToGroups(plan){
  if(!plan) return {};
  if(plan.isEDI) return ediToBayGroups(plan.ediRows, state.shipType);
  if(!plan.bays || !plan.bays.length){
    // 사진이거나 베이 텍스트를 못읽음 → 빈 결과(사용자에게 안내됨)
    return {};
  }
  const res=analyzePlan(plan, state.shipType);
  const groups={};
  for(const lbl in res){
    const gk=res[lbl].group; const c=res[lbl].cones;
    if(!groups[gk]) groups[gk]={deck:0,ele:0,hold:0};
    groups[gk].deck+=c.deck; groups[gk].ele+=c.ele; groups[gk].hold+=c.hold;
  }
  return groups;
}
function runCalc(){
  showLoading('계산 중...');
  setTimeout(()=>{
    try{
      // 양하/선적 선박명 다르면 경고(다른 항차 자료일 수 있음)
      const vs=state.stow&&state.stow.vessel, vd=state.disch&&state.disch.vessel;
      const norm=s=>(s||'').toUpperCase().replace(/\s+/g,'');
      window.__vesselWarn = (vs&&vd&&norm(vs)!==norm(vd)) ? ('⚠ 양하('+vd+')와 선적('+vs+') 선박명이 다릅니다. 같은 항차 자료인지 확인하세요.') : '';
      const sg=planToGroups(state.stow);
      const dg=planToGroups(state.disch);
      const allk=new Set([...Object.keys(sg),...Object.keys(dg)].map(Number));
      const groups={};
      for(const k of allk){
        groups[k]={
          stow: sg[k]||{deck:0,ele:0,hold:0},
          disch: dg[k]||{deck:0,ele:0,hold:0},
          labels:[k+'번']
        };
      }
      renderResults(groups);
    }catch(err){
      document.getElementById('resultArea').innerHTML=
        `<div class="card"><p style="color:var(--rem)">계산 오류: ${err.message}</p></div>`;
    }
  },50);
}

// ============ 베이 위치 보기 (양하·선적 구분) ============
// 콘앱이 이미 가진 EDI 위치값(bay/row/tier/size)만으로 베이별 격자를 그린다.
// 베이사전 불필요. 양하=파랑, 선적=초록, 둘 다=주황.
function renderBayView(){
  const ra=document.getElementById('resultArea');
  // 컨테이너 수집: bay → 'row_tier' → { d:{...}|null, l:{...}|null } (양하/선적 각각 컨테이너 정보)
  const bays={};
  const add=(rows,flag)=>{
    if(!rows) return;
    for(const r of rows){
      const b=parseInt(r.bay,10); if(!Number.isFinite(b)) continue;
      if(!bays[b]) bays[b]={};
      const key=r.row+'_'+String(r.tier).padStart(2,'0');
      if(!bays[b][key]) bays[b][key]={row:r.row,tier:String(r.tier).padStart(2,'0')};
      bays[b][key][flag]=r;  // 그 쪽(양하 d / 선적 l) 컨테이너 전체 정보
    }
  };
  add(state.disch&&state.disch.ediRows,'d');
  add(state.stow&&state.stow.ediRows,'l');

  const bayKeys=Object.keys(bays).map(Number).sort((a,b)=>a-b);
  if(!bayKeys.length){ ra.innerHTML='<div class="card"><div class="empty-note">표시할 컨테이너가 없습니다.</div></div>'; return; }

  const hasD=!!(state.disch&&state.disch.ediRows&&state.disch.ediRows.length);
  const hasL=!!(state.stow&&state.stow.ediRows&&state.stow.ediRows.length);
  const shipLabel=state.shipName||'선박';
  const today=new Date().toLocaleDateString('ko-KR');

  // 평택분 판정 (양하=pod 평택, 선적=pol 평택)
  const isPtk=(c,flag)=>{
    if(!c) return false;
    const p=String((flag==='d'?c.pod:c.pol)||'').toUpperCase();
    return /PTK|PYT|PYOTM/.test(p) || p==='' ;
  };
  // 특수타입 라벨/심볼
  const special=(c)=>{
    if(!c) return null;
    if(c.dg) return {sym:'⚠',label:'DG',cls:'sp-dg'};
    if(c.reefer) return {sym:'❄',label:(c.temp!=null?(c.temp+'°'):'RF'),cls:'sp-rf'};
    if(c.fr) return {sym:'▭',label:'FR',cls:'sp-fr'};
    if(c.tk) return {sym:'▣',label:'TK',cls:'sp-tk'};
    if(c.ot||c.oog) return {sym:'△',label:'OT',cls:'sp-ot'};
    return null;
  };
  // 셀 색 클래스
  const cellCls=(c,flag)=>{
    const sp=special(c);
    if(sp) return 'bvc '+sp.cls;
    if(isPtk(c,flag)) return 'bvc '+(flag==='d'?'ptk-d':'ptk-l');  // 평택분 강조
    return 'bvc '+(flag==='d'?'oth-d':'oth-l');                    // 통과/타항
  };
  // POL/POD 짧게 (뒤 3자)
  const short=p=>{ p=String(p||'').toUpperCase(); return p.length>=5?p.slice(2,5):p; };

  let html=`<div class="card">
    <div class="share-head"><div class="sh-title">베이플랜 (양하·선적 비교)</div>
      <div class="sh-sub">${shipLabel} · ${today}</div></div>
    <div class="bv-legend">
      <span class="bv-lg ptkd">양하 평택</span>
      <span class="bv-lg ptkl">선적 평택</span>
      <span class="bv-lg rf">❄리퍼</span>
      <span class="bv-lg dg">⚠위험물</span>
      <span class="bv-lg" style="color:var(--dim)">★평택분</span>
    </div>`;

  for(const bk of bayKeys){
    const cells=bays[bk];
    const tiers=[...new Set(Object.values(cells).map(c=>parseInt(c.tier,10)))].sort((a,b)=>b-a);
    const rowsSet=[...new Set(Object.values(cells).map(c=>c.row))];
    const evens=rowsSet.filter(r=>parseInt(r,10)%2===0 && r!=='00').sort((a,b)=>parseInt(b)-parseInt(a));
    const zero=rowsSet.filter(r=>r==='00');
    const odds=rowsSet.filter(r=>parseInt(r,10)%2===1).sort((a,b)=>parseInt(a)-parseInt(b));
    const rowOrder=[...evens,...zero,...odds];
    const deckTiers=tiers.filter(t=>t>=80), holdTiers=tiers.filter(t=>t<80);

    const cnt={d:0,l:0};
    Object.values(cells).forEach(c=>{ if(c.d)cnt.d++; if(c.l)cnt.l++; });

    // 한 칸(컨테이너 박스) — 검수앱 셀 모양: POL/POD, 컨번호, F/E·온도, 평택★
    const boxCell=(c,flag)=>{
      const ct=c[flag];
      if(!ct) return '<td class="bv-slot off"></td>';
      const sp=special(ct);
      const ptk=isPtk(ct,flag);
      const fe=ct.fe==='E'?'E':(ct.fe==='F'?'F':'');
      const pol=short(ct.pol), pod=short(ct.pod);
      const cn=(ct.cn||'').slice(0,4)+(ct.cn?'<br>'+(ct.cn||'').slice(4):''); // 2줄
      const line3 = sp ? sp.label : (ct.size+'ft '+fe);
      return `<td class="${cellCls(ct,flag)}" title="${ct.cn||''} row ${c.row} tier ${c.tier}">`
        +`<div class="bvc-in">`
        +`<div class="bvc-pp">${pol||'·'}/<b>${pod||'·'}</b>${ptk?'<span class="bvc-star">★</span>':''}</div>`
        +`<div class="bvc-cn">${ct.cn||'—'}</div>`
        +`<div class="bvc-l3">${sp?sp.sym+' ':''}${line3}</div>`
        +`</div></td>`;
    };

    const grid=(tierList, flag)=>{
      if(!tierList.length) return '';
      let head='<tr><td class="bv-tl"></td>';
      for(const r of rowOrder) head+=`<td class="bv-rl">${r}</td>`;
      head+='</tr>';
      let g='<table class="bv-tab box"><tbody>'+head;
      for(const t of tierList){
        const tk=String(t).padStart(2,'0');
        g+=`<tr><td class="bv-tl">${tk}</td>`;
        for(const r of rowOrder){
          const c=cells[r+'_'+tk];
          if(!c){ g+='<td class="bv-slot"></td>'; continue; }
          g+=boxCell(c,flag);
        }
        g+='</tr>';
      }
      g+='</tbody></table>';
      return g;
    };
    const panel=(flag,label,count)=>{
      let p=`<div class="bv-col"><div class="bv-colhd ${flag}">${label} <span class="bv-cnt">${count}대</span></div>`;
      if(deckTiers.length){ p+=`<div class="bv-sec">갑판</div>${grid(deckTiers,flag)}`; }
      if(holdTiers.length){ p+=`<div class="bv-sec">선창</div>${grid(holdTiers,flag)}`; }
      p+='</div>';
      return p;
    };

    html+=`<div class="bv-bay"><div class="bv-bayhd">BAY ${String(bk).padStart(2,'0')}</div>
      <div class="bv-split">`;
    if(hasD) html+=panel('d','양하',cnt.d);
    if(hasL) html+=panel('l','선적',cnt.l);
    html+='</div></div>';
  }
  html+='</div>';
  ra.innerHTML=html;
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderResults(groups){
  const ra=document.getElementById('resultArea');
  const keys=Object.keys(groups).map(Number).sort((a,b)=>a-b)
    .filter(k=>{const g=groups[k];return (g.stow.deck+g.stow.ele+g.stow.hold+g.disch.deck+g.disch.ele+g.disch.hold)>0;});
  if(!keys.length){ ra.innerHTML='<div class="card"><div class="empty-note">인식된 베이가 없습니다. EDI를 쓰거나, 사진이면 더 또렷하게 찍어주세요.</div></div>'; return; }

  // 행 데이터 만들기
  const rows=keys.map(k=>{
    const g=groups[k];
    const sd=distribute(g.stow), dd=distribute(g.disch);
    return {
      bay:k,
      deck:{need:sd.deckPer, have:dd.deckPer, diff:sd.deckPer-dd.deckPer},
      ele:{need:sd.elePer, have:dd.elePer, diff:sd.elePer-dd.elePer},
      hold:{need:g.stow.hold*2, have:g.disch.hold*2, diff:g.stow.hold*2-g.disch.hold*2},
    };
  });

  const shipLabel = state.shipName ? state.shipName : '선박 미입력';
  const today=new Date().toLocaleDateString('ko-KR');

  let html='';
  if(window.__vesselWarn){ html+=`<div class="card" style="border-color:var(--rem)"><p style="color:var(--rem);margin:0;font-size:14px">${window.__vesselWarn}</p></div>`; }
  html+=`<div class="confirm-bar"><p><b>⚠ 인식 결과 확인</b> — 콘 작업 전 반드시 대조하세요.</p></div>`;

  html+=`<div class="card" id="shareCard">
    <div class="share-head">
      <div class="sh-title">콘 작업표</div>
      <div class="sh-sub">${shipLabel} · ${today} · ${state.shipType==='container'?'컨테이너선':'일반/복합선'}</div>
    </div>
    <table class="ctab">
      <thead><tr><th>베이</th><th>데크콘<br><small>4곳·곳당</small></th><th>코끼리콘<br><small>중간·곳당</small></th><th>홀드콘<br><small>중간</small></th></tr></thead>
      <tbody>`;
  for(const r of rows){
    html+=`<tr>
      <td class="bay-c">${r.bay}</td>
      ${cell(r.deck)}${cell(r.ele)}${cell(r.hold)}
    </tr>`;
  }
  html+=`</tbody></table>
    <div class="legend"><span class="lg add">초록 +추가</span><span class="lg rem">빨강 −반납</span><span class="lg keep">회색 그대로</span></div>
  </div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn-share" id="btnImg">📷 이미지 저장</button>
    <button class="btn-share" id="btnTxt">📋 텍스트 복사</button>
  </div>`;
  ra.innerHTML=html;

  document.getElementById('btnImg').onclick=()=>saveImage(rows,shipLabel,today);
  document.getElementById('btnTxt').onclick=()=>copyText(rows,shipLabel,today);
}

function cell(c){
  if(c.need===0&&c.have===0) return '<td class="keep-c">·</td>';
  let cls,txt;
  if(c.diff>0){cls='add';txt='+'+c.diff;}
  else if(c.diff<0){cls='rem';txt='−'+(-c.diff);}
  else {cls='keep';txt='0';}
  return `<td class="${cls}-c"><span class="big">${txt}</span><span class="sub">${c.have}→${c.need}</span></td>`;
}

function copyText(rows,ship,today){
  let t=`[콘 작업표] ${ship} ${today}\n`;
  t+=`(콘: 데크/코끼리/홀드, +추가 −반납)\n`;
  for(const r of rows){
    const f=(c)=> c.diff>0?`+${c.diff}`:c.diff<0?`-${-c.diff}`:'0';
    t+=`${r.bay}번: 데크${f(r.deck)} 코끼리${f(r.ele)} 홀드${f(r.hold)}\n`;
  }
  navigator.clipboard.writeText(t).then(()=>alert('복사됐습니다. 카톡에 붙여넣으세요.'),
    ()=>{ prompt('아래를 복사하세요:',t); });
}

function saveImage(rows,ship,today){
  // 캔버스에 표를 그려 PNG로 저장
  const W=720, rowH=54, headH=120, foot=40;
  const H=headH + rows.length*rowH + foot;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  // 헤더
  x.fillStyle='#0f1419'; x.font='bold 26px sans-serif';
  x.fillText('콘 작업표', 24, 40);
  x.fillStyle='#555'; x.font='15px sans-serif';
  x.fillText(`${ship} · ${today} · ${state.shipType==='container'?'컨테이너선':'일반/복합선'}`, 24, 66);
  // 열 헤더
  const cols=[ {t:'베이',x:24,w:90}, {t:'데크콘',x:130,w:190}, {t:'코끼리콘',x:330,w:190}, {t:'홀드콘',x:530,w:170} ];
  x.fillStyle='#e8a000'; x.fillRect(0,headH-34,W,34);
  x.fillStyle='#1a1206'; x.font='bold 16px sans-serif';
  cols.forEach(c=>x.fillText(c.t, c.x+8, headH-12));
  // 행
  let y=headH;
  rows.forEach((r,i)=>{
    x.fillStyle = i%2? '#f4f7fa':'#ffffff'; x.fillRect(0,y,W,rowH);
    x.fillStyle='#0f1419'; x.font='bold 22px sans-serif';
    x.fillText(r.bay+'번', 32, y+34);
    drawCell(x, r.deck, 130, y, rowH);
    drawCell(x, r.ele, 330, y, rowH);
    drawCell(x, r.hold, 530, y, rowH);
    x.strokeStyle='#dde3ea'; x.beginPath(); x.moveTo(0,y+rowH); x.lineTo(W,y+rowH); x.stroke();
    y+=rowH;
  });
  x.fillStyle='#888'; x.font='13px sans-serif';
  x.fillText('+추가  −반납  ·그대로   |  콘 작업 전 반드시 확인', 24, y+26);
  // 다운로드
  const url=cv.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=url; a.download=`콘작업표_${ship}_${today}.png`.replace(/[\\/:*?"<>|]/g,'_');
  a.click();
}
function drawCell(x,c,cx,y,rowH){
  if(c.need===0&&c.have===0){ x.fillStyle='#bbb'; x.font='20px sans-serif'; x.fillText('·',cx+8,y+34); return; }
  let col, txt;
  if(c.diff>0){col='#1a9c5b'; txt='+'+c.diff;}
  else if(c.diff<0){col='#d83a3a'; txt='−'+(-c.diff);}
  else {col='#888'; txt='0';}
  x.fillStyle=col; x.font='bold 24px sans-serif'; x.fillText(txt, cx+8, y+30);
  x.fillStyle='#999'; x.font='13px sans-serif'; x.fillText(`${c.have}→${c.need}`, cx+8, y+48);
}

// ============ 선박 설정 저장 (localStorage) ============

try{ render(); loadVoyageList(); }catch(e){
  document.getElementById('app').innerHTML='<div class="card"><p style="color:var(--rem)">초기화 오류: '+e.message+'</p></div>';
}
</script>
